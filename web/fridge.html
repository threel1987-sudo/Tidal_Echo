<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>冰箱门 · Fridge Door</title>

<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link href="https://cdn.jsdelivr.net/npm/@fontsource/cormorant-garamond@5/400.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@fontsource/cormorant-garamond@5/500.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@fontsource/cormorant-garamond@5/400-italic.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5/400.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5/500.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@fontsource/pinyon-script@5/400.min.css" rel="stylesheet">
<link rel="preload" href="chat-light.webp" as="image">
<meta name="theme-color" content="#F7FAFC">

<script>
  /* Pearl (light) theme — matches the PWA's default preset. */
  (function(){ document.documentElement.setAttribute("data-theme","light"); })();
</script>

<style>
/* ───────── Pearl Tide · light theme (shared with the PWA) ───────── */
:root{
  --font-en:"Cormorant Garamond",Georgia,serif;
  --font-cn:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  --font-script:"Pinyon Script","Cormorant Garamond",cursive;

  --bg:#F7FAFC;
  --wall:url("chat-light.webp");
  --text:#253447;
  --text-soft:#5E7080;
  --text-faint:#8A99A8;
  --accent:#4C6378;
  --accent-deep:#2C4056;
  --hairline:rgba(120,142,165,.24);
  --card-bg:rgba(248,251,253,.58);
  --card-line:rgba(150,168,182,.22);
  --field-bg:rgba(255,255,255,.55);
  --field-line:rgba(255,255,255,.7);
  --sheet-bg:rgba(252,253,255,.90);
  --sheet-line:rgba(255,255,255,.85);
  --sheet-hi:rgba(255,255,255,.7);
  --sheet-scrim:rgba(44,60,78,.44);
  --shadow:0 18px 46px rgba(74,93,108,.12);
  --soft-shadow:0 10px 26px rgba(86,104,118,.10);
  --scrim:linear-gradient(180deg,rgba(255,255,255,.48),rgba(255,255,255,.16) 32%,rgba(255,255,255,.06) 66%,rgba(255,255,255,.30));
  --danger:#b06a6f;
  /* 冰箱门 / 便利贴专用 */
  --door-a:#EDF2F6;
  --door-b:#D9E2EA;
  --door-line:rgba(120,142,165,.35);
  --note:#FFF6D8;
  --note-line:#EADFA9;
  --note-fold:#F0E4B4;
  --note-ink:#5A4A26;
  --note-muted:#9A8B5C;
}

*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; padding:0; }
body{
  background:var(--bg); color:var(--text);
  font-family:var(--font-cn); font-size:15px; line-height:1.6;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  min-height:100vh; overflow-x:hidden;
}
.wall{ position:fixed; inset:0; z-index:-2; background:var(--bg) var(--wall) center/cover no-repeat; }
.wall::after{ content:""; position:absolute; inset:0; background:var(--scrim); }
img{ display:block; max-width:100%; }
button{ font:inherit; color:inherit; cursor:pointer; border:none; background:none; }
.hidden{ display:none !important; }

.glass{ background:var(--field-bg); border:1px solid var(--field-line);
  box-shadow:var(--soft-shadow), inset 0 1px 0 var(--sheet-hi);
  -webkit-backdrop-filter:blur(16px) saturate(1.25); backdrop-filter:blur(16px) saturate(1.25); }

/* ───────── 顶栏 ───────── */
.bar{
  position:sticky; top:0; z-index:30; display:flex; align-items:flex-start; gap:6px;
  padding:calc(8px + env(safe-area-inset-top)) clamp(16px,5vw,28px) 4px;
  background:linear-gradient(180deg,rgba(247,250,252,.82),rgba(247,250,252,0));
  -webkit-backdrop-filter:blur(12px) saturate(1.15); backdrop-filter:blur(12px) saturate(1.15);
}
.bar .icon{ width:36px; height:36px; margin-top:-3px; margin-left:-7px; display:grid; place-items:center; border-radius:50%;
  color:var(--text); transition:background .2s,transform .15s; }
.bar .icon:active{ transform:scale(.9); background:var(--hairline); }
.bar .icon svg{ width:23px; height:23px; }
.bar .grow{ flex:1; }
.top-label{ text-align:right; font-family:var(--font-en); font-size:11.5px; font-weight:500;
  letter-spacing:.32em; line-height:1.4; color:var(--text-faint); padding-right:2px; }
.top-label .rule{ display:block; width:28px; height:1px; background:var(--hairline); margin:5px 0 0 auto; }

.wrap{ max-width:560px; margin:0 auto; padding:0 clamp(16px,5vw,28px) calc(22px + env(safe-area-inset-bottom)); position:relative; z-index:1; }

/* ───────── Hero ───────── */
.hero{ text-align:left; padding:2px 0 4px; }
.hero h1{ font-family:var(--font-script); font-weight:400; color:var(--text);
  font-size:clamp(33px,10.6vw,46px); line-height:1; margin:0; }
.hero .sub{ font-family:var(--font-en); font-style:italic; font-size:clamp(13px,3.8vw,16px);
  color:var(--text-soft); margin-top:0; letter-spacing:.01em; }

/* ───────── 场景状态条 ───────── */
.status{ display:flex; align-items:center; gap:10px; margin:10px 0 14px; padding:11px 14px; border-radius:18px; }
.status .ic{ font-size:20px; line-height:1; }
.status .tx{ flex:1; min-width:0; font-size:13px; line-height:1.55; color:var(--text-soft); }
.status .tx b{ color:var(--text); font-weight:500; }
.status .count{ flex:0 0 auto; font-family:var(--font-cn); font-size:12.5px; color:var(--accent-deep);
  background:rgba(255,255,255,.65); border:1px solid var(--card-line); padding:4px 11px; border-radius:20px; white-space:nowrap; }

/* ───────── 冰箱门 ───────── */
.door-wrap{ display:flex; justify-content:center; margin:4px 0 14px; }
.door{ position:relative; width:100%; max-width:352px; min-height:400px; border-radius:30px;
  background:linear-gradient(158deg,var(--door-a) 0%,var(--door-b) 62%,#C9D5DE 100%);
  border:1px solid var(--door-line);
  box-shadow:0 24px 54px rgba(60,80,98,.22), inset 0 1.5px 0 rgba(255,255,255,.85), inset 0 -14px 26px rgba(120,140,160,.14);
  padding:26px 16px 60px; }
/* 门缝 + 拉手 */
.door::before{ content:""; position:absolute; left:50%; top:34px; bottom:34px; width:1.5px;
  background:linear-gradient(180deg,rgba(120,142,165,.05),rgba(120,142,165,.38),rgba(120,142,165,.05)); transform:translateX(-50%); }
.door::after{ content:""; position:absolute; right:20px; top:50%; width:5px; height:74px; border-radius:4px; transform:translateY(-50%);
  background:linear-gradient(180deg,#EDF2F6,#B9C7D2 55%,#EDF2F6);
  box-shadow:0 2px 5px rgba(60,80,98,.28), inset 0 1px 0 rgba(255,255,255,.9); }
.door-top{ position:absolute; left:0; right:0; top:0; height:22px; padding:0 8px;
  display:flex; align-items:center; justify-content:center; }
.door-top .brand{ font-family:var(--font-en); font-style:italic; font-size:10.5px; letter-spacing:.34em;
  color:var(--text-faint); text-transform:uppercase; }

/* 门上的纸条区 */
.notes{ position:relative; z-index:1; display:flex; flex-direction:column; gap:12px; align-items:center; }
.door-empty{ position:relative; z-index:1; padding:84px 24px 0; text-align:center; }
.door-empty svg{ width:44px; height:44px; color:var(--text-faint); opacity:.75; margin:0 auto; display:block; }
.door-empty .en{ font-family:var(--font-en); font-style:italic; font-size:17px; color:var(--text-faint); margin-top:10px; }
.door-empty p{ font-family:var(--font-cn); font-size:13px; color:var(--text-soft); margin:6px 0 0; line-height:1.7; }

/* 便利贴 */
.note{ position:relative; width:min(268px,86%); background:var(--note); border:1px solid var(--note-line);
  border-radius:3px; padding:14px 15px 12px; box-shadow:0 7px 16px rgba(90,74,38,.18), inset 0 1px 0 rgba(255,255,255,.6);
  color:var(--note-ink); animation:popIn .45s both; }
.note:nth-child(odd){ transform:rotate(-1.6deg); }
.note:nth-child(even){ transform:rotate(1.3deg); }
.note::before{ content:""; position:absolute; right:-1px; top:-1px; width:18px; height:18px;
  background:linear-gradient(225deg,var(--note-fold) 50%,transparent 51%); border-radius:0 0 0 6px; }
.note .mask{ position:absolute; left:0; right:0; top:0; height:18px;
  background:rgba(255,255,255,.28); border-radius:2px 2px 0 0; pointer-events:none; }
.note .x{ position:absolute; right:6px; top:4px; width:22px; height:22px; display:grid; place-items:center;
  border-radius:50%; color:var(--note-muted); z-index:2; font-size:14px; line-height:1; transition:background .2s; }
.note .x:active{ background:rgba(90,74,38,.14); }
.note .tx{ font-family:var(--font-cn); font-size:14px; line-height:1.65; white-space:pre-wrap; word-break:break-word; padding-right:10px; }
.note .meta{ display:flex; align-items:center; gap:8px; margin-top:10px; }
.note .who{ font-family:var(--font-cn); font-size:12px; font-weight:500; color:var(--note-ink); }
.note .tm{ font-family:var(--font-en); font-size:11px; letter-spacing:.03em; color:var(--note-muted); }
.note .meta .grow{ flex:1; }
.note .tag{ font-family:var(--font-cn); font-size:11px; padding:3px 9px; border-radius:20px; white-space:nowrap; }
.note .tag.new{ background:rgba(214,93,86,.13); color:#B64B45; }
.note .tag.wait{ background:rgba(90,74,38,.09); color:var(--note-muted); }
.note .tag.read{ background:rgba(120,142,165,.12); color:var(--text-faint); }
.note.readx{ opacity:.78; filter:saturate(.72); }
.note.readx .tx{ color:var(--note-muted); }
.note button.rd{ font-family:var(--font-cn); font-size:11.5px; color:var(--note-ink);
  text-decoration:underline; text-underline-offset:3px; opacity:.85; padding:2px 0; }
.note button.rd:active{ opacity:.5; }

/* ───────── 底部操作 ───────── */
.acts{ display:flex; gap:10px; margin:2px 0 8px; }
.acts button{ flex:1; padding:12px; border-radius:15px; font-family:var(--font-cn); font-size:13.5px; letter-spacing:.02em;
  color:var(--text); transition:transform .15s; display:flex; align-items:center; justify-content:center; gap:6px; }
.acts button svg{ width:15px; height:15px; color:var(--text-soft); }
.acts button:active{ transform:scale(.96); }
.acts button.on{ background:var(--accent-deep); color:#fff; box-shadow:var(--soft-shadow); }
.acts button.on svg{ color:rgba(255,255,255,.85); }
.acts button:disabled{ opacity:.45; }
.hint{ text-align:center; font-family:var(--font-cn); font-size:12px; color:var(--text-faint); margin:6px 0 2px; }

/* ───────── 贴纸条 modal ───────── */
.modal{ position:fixed; inset:0; z-index:70; display:grid; place-items:center; padding:18px;
  background:var(--sheet-scrim); -webkit-backdrop-filter:blur(7px); backdrop-filter:blur(7px); animation:fade .25s; }
.sheet{ position:relative; width:100%; max-width:430px; max-height:88vh; overflow-y:auto; border-radius:24px; padding:24px 20px 22px;
  background:var(--sheet-bg); border:1px solid var(--sheet-line);
  box-shadow:var(--shadow), inset 0 1px 0 var(--sheet-hi);
  -webkit-backdrop-filter:blur(28px) saturate(1.3); backdrop-filter:blur(28px) saturate(1.3);
  animation:sheetIn .32s cubic-bezier(.22,1,.36,1) both; }
.sheet-x{ position:absolute; top:13px; right:13px; width:30px; height:30px; display:grid; place-items:center;
  border-radius:50%; color:var(--text-soft); font-size:19px; line-height:1; transition:background .2s; }
.sheet-x:active{ background:var(--hairline); }
.sheet .fh{ font-family:var(--font-cn); font-weight:500; font-size:19px; text-align:center; margin:0 0 3px; }
.sheet .fsub{ font-family:var(--font-en); font-style:italic; font-size:13px; color:var(--text-faint); text-align:center; margin:0 0 16px; }
.sheet .memo{ background:var(--note); border:1px solid var(--note-line); border-radius:8px; padding:14px 15px; }
.sheet textarea{ width:100%; min-height:110px; resize:none; border:none; outline:none; background:none;
  color:var(--note-ink); font-family:var(--font-cn); font-size:14.5px; line-height:1.7; }
.sheet textarea::placeholder{ color:var(--note-muted); }
.sheet .cnt{ text-align:right; font-family:var(--font-en); font-size:11px; color:var(--note-muted); margin-top:6px; }
.sheet .tip{ font-family:var(--font-cn); font-size:12px; color:var(--text-soft); margin:14px 2px 0; line-height:1.7; }
.sheet .row{ display:flex; gap:10px; margin-top:20px; }
.sheet .row button{ flex:1; padding:12px; border-radius:13px; font-family:var(--font-cn); font-size:14px; letter-spacing:.02em;
  transition:transform .15s; }
.sheet .row button:active{ transform:scale(.96); }
.sheet .row .ghost{ flex:0 0 38%; background:var(--field-bg); border:1px solid var(--field-line); color:var(--text-soft);
  box-shadow:inset 0 1px 0 var(--sheet-hi); }
.sheet .row .send{ background:var(--accent-deep); color:#fff; box-shadow:var(--soft-shadow); }
.sheet .status{ margin-top:12px; font-family:var(--font-cn); font-size:12.5px; color:var(--text-soft); text-align:center; min-height:1.1em; }

/* gate 门 */
.gatebox{ background:var(--sheet-bg); border:1px solid var(--sheet-line); border-radius:22px; padding:22px 20px;
  box-shadow:var(--shadow), inset 0 1px 0 var(--sheet-hi); -webkit-backdrop-filter:blur(20px); backdrop-filter:blur(20px); margin-top:8px; }
.gatebox p{ font-family:var(--font-cn); font-size:13px; color:var(--text-soft); text-align:center; margin:0 0 14px; line-height:1.6; }
.gatebox input{ width:100%; padding:11px 14px; border:1px solid var(--field-line); border-radius:12px;
  background:var(--field-bg); color:var(--text); font-family:var(--font-cn); font-size:14px; outline:none; }
.gatebox .row{ display:flex; gap:10px; margin-top:14px; }
.gatebox .row button{ flex:1; padding:12px; border-radius:13px; font-family:var(--font-cn); font-size:14px; transition:transform .15s; }
.gatebox .row button:active{ transform:scale(.96); }
.gatebox .row .ghost{ background:var(--field-bg); border:1px solid var(--field-line); color:var(--text-soft); }
.gatebox .row .send{ background:var(--accent-deep); color:#fff; }

/* 动画 */
@keyframes popIn{ from{ opacity:0; transform:translateY(10px) scale(.97) rotate(0deg);} }
@keyframes fade{ from{ opacity:0;} }
@keyframes sheetIn{ from{ opacity:0; transform:translateY(20px) scale(.97);} }
@media (prefers-reduced-motion:reduce){ *{ animation:none !important; } }
@media(hover:hover){ .note:hover{ filter:brightness(1.02); } }
</style>
</head>
<body>
<div class="wall"></div>

<!-- 顶栏 -->
<div class="bar">
  <button class="icon" id="topBack" title="返回">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
  </button>
  <span class="grow"></span>
  <div class="top-label" id="topLabel">FRIDGE<br>DOOR<span class="rule"></span></div>
</div>

<!-- ════════ 主页 ════════ -->
<div class="wrap" id="mainView">
  <div class="hero">
    <h1>Fridge Door</h1>
    <div class="sub">someone leaves, the door remembers.</div>
  </div>

  <div class="status glass hidden" id="statusBar">
    <span class="ic" id="statusIc">🏠</span>
    <span class="tx" id="statusTx"></span>
    <span class="count hidden" id="statusCount"></span>
  </div>

  <div class="door-wrap">
    <div class="door">
      <div class="door-top"><span class="brand">our home</span></div>
      <div class="notes" id="notesBox"></div>
      <div class="door-empty hidden" id="doorEmpty">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><rect x="4.2" y="3" width="15.6" height="18" rx="2"/><path d="M8.8 3v1.2M15.2 3v1.2M8.8 21v-1.2M15.2 21v-1.2"/></svg>
        <div class="en">the door is clean</div>
        <p id="emptyText">有人不在家的时候,这里才会长出纸条。</p>
      </div>
    </div>
  </div>

  <div class="acts">
    <button class="glass" id="addBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      贴一张
    </button>
    <button class="glass hidden" id="readAllBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg>
      全部读过了
    </button>
  </div>
  <div class="hint" id="addHint"></div>
  <div class="hint hidden" id="errLine" style="color:var(--danger)"></div>
</div>

<!-- ════════ token 门 ════════ -->
<div class="wrap gate hidden" id="gateView">
  <div class="hero" style="padding-top:40px"><h1>Fridge Door</h1><div class="sub">a private little door</div></div>
  <div class="gatebox">
    <p>没读到访问密钥——先在主页登录，或在此粘贴密钥（与 PWA 同一个）。</p>
    <input type="text" id="gateInput" placeholder="访问密钥">
    <div class="row">
      <button class="ghost" id="gateHome">去主页</button>
      <button class="send" id="gateSave">保存并进入</button>
    </div>
  </div>
</div>

<!-- ════════ 贴纸条 modal ════════ -->
<div class="modal hidden" id="writeModal">
  <div class="sheet" id="writeSheet">
    <button class="sheet-x" id="writeClose" aria-label="关闭">✕</button>
    <div class="fh">往冰箱门上贴一张</div>
    <div class="fsub">a note for the one who comes home</div>
    <div class="memo">
      <textarea id="noteText" maxlength="500" placeholder="牛奶喝完了…
记得浇花…"></textarea>
      <div class="cnt"><span id="noteCnt">0</span>/500</div>
    </div>
    <div class="tip" id="writeTip"></div>
    <div class="row">
      <button class="ghost" id="writeCancel">取消</button>
      <button class="send" id="writeSend">贴上去</button>
    </div>
    <div class="status" id="writeStatus"></div>
  </div>
</div>

<script>
/* ─────────────────────────────────────────────────────────────
   Fridge Door — 冰箱门便利贴。
   纸条存在 relay 服务端(/app/fridge),两个人共享:
   · 有人不在家时贴上去(pinned),对方回来读一次(read),之后可撕掉。
   · AI 侧通过 home_state MCP 的 fridge 工具读写同一份数据。
   ───────────────────────────────────────────────────────────── */
const API_BASE="/relay";
const LS_KEY="companion_secret";
let secret=localStorage.getItem(LS_KEY)||"";

const AI_NAME=(localStorage.getItem("companion_profile_remark")||"").trim()||"Claude";
const HUMAN_NAME="我";

const $=(id)=>document.getElementById(id);
function authHeaders(extra){ return Object.assign({"Authorization":"Bearer "+secret}, extra||{}); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

async function api(path,opts){
  const r=await fetch(API_BASE+path, opts||{headers:authHeaders()});
  if(r.status===401){ secret=""; localStorage.removeItem(LS_KEY); show("gate"); throw new Error("401"); }
  if(!r.ok){ let d=""; try{ d=(await r.json()).detail; }catch(_){} throw new Error(d||("HTTP "+r.status)); }
  return r;
}

function show(name){
  $("mainView").classList.toggle("hidden", name!=="main");
  $("gateView").classList.toggle("hidden", name!=="gate");
  window.scrollTo(0,0);
}

/* ── 状态 ── */
let SNAPSHOT={notes:[],unread:{for_human:0,for_ai:0}};
let SCENARIO=null;   // null = 读不到 loop 配置(未接 loop),按中性处理

const SC_TXT={
  together_at_home:{ ic:"🏠", t:"两个人都到家了。" },
  away:{ ic:"📱", t:"你在外面,他一个人在家。" },
  together_out:{ ic:"🚶", t:"两个人都出门了,冰箱门在家等你们。" },
};

function fmtTime(iso){
  try{
    const d=new Date(iso);
    if(isNaN(d.getTime())) return "";
    return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
  }catch(_){ return ""; }
}

/* ── 渲染 ── */
function render(){
  const notes=(SNAPSHOT.notes||[]).slice();
  const unread=SNAPSHOT.unread||{for_human:0,for_ai:0};
  const box=$("notesBox"), empty=$("doorEmpty");
  box.innerHTML="";
  empty.classList.toggle("hidden", notes.length>0);

  notes.forEach((n,i)=>{
    const el=document.createElement("div");
    const byAi=n.author==="ai";
    const isNew=n.state==="pinned";
    el.className="note"+(isNew?"":" readx");
    el.style.animationDelay=(i*45)+"ms";
    let tag="";
    if(isNew){
      tag=byAi
        ? `<span class="tag new">等你读</span>`
        : `<span class="tag wait">他还没读</span>`;
    }else{
      tag=`<span class="tag read">已读</span>`;
    }
    const rd=isNew&&byAi ? `<button class="rd" type="button">读过了</button>` : "";
    el.innerHTML=`
      <div class="mask"></div>
      <button class="x" type="button" title="撕掉">✕</button>
      <div class="tx">${esc(n.text)}</div>
      <div class="meta">
        <span class="who">${byAi?esc(AI_NAME):HUMAN_NAME}</span>
        <span class="tm">${esc(fmtTime(n.ts))}</span>
        <span class="grow"></span>
        ${tag}
        ${rd}
      </div>`;
    el.querySelector(".x").onclick=()=>{
      if(confirm("把这张纸条从冰箱门上撕下来?")) tear(n.id);
    };
    const rdBtn=el.querySelector(".rd");
    if(rdBtn) rdBtn.onclick=()=>readNote(n.id);
    box.appendChild(el);
  });

  if(!notes.length){
    $("emptyText").textContent=SCENARIO==="together_at_home"
      ? "都在家,门上空空的也很好。谁出门了,这里才会长出纸条。"
      : "有人不在家的时候,这里才会长出纸条。";
  }

  /* 场景状态条 */
  const bar=$("statusBar");
  if(SCENARIO){
    const meta=SC_TXT[SCENARIO]||SC_TXT.together_at_home;
    $("statusIc").textContent=meta.ic;
    let tx=meta.t;
    if(SCENARIO==="away"&&unread.for_human>0)
      tx+=` <b>他往门上贴了 ${unread.for_human} 张纸条,等你回来读。</b>`;
    else if(SCENARIO==="together_at_home"&&unread.for_human>0)
      tx+=` <b>出门时他留了 ${unread.for_human} 张纸条——该读啦。</b>`;
    else if(SCENARIO==="together_at_home"&&unread.for_ai>0)
      tx+=` 你留给他的 ${unread.for_ai} 张,他还没读。`;
    else if(SCENARIO==="together_at_home")
      tx+=" 冰箱门上没有没读的纸条。";
    else if(unread.for_ai>0)
      tx+=` 你留了 ${unread.for_ai} 张给他,等他想起来读。`;
    $("statusTx").innerHTML=tx;
    $("statusCount").classList.toggle("hidden", !(unread.for_human>0));
    if(unread.for_human>0) $("statusCount").textContent=`等你读 · ${unread.for_human}`;
  }else{
    $("statusIc").textContent="🧊";
    $("statusTx").innerHTML=unread.for_human>0
      ? `<b>门上有 ${unread.for_human} 张纸条等你读。</b>`
      : "未接 loop,读不到出门/在家状态;纸条功能照常可用。";
    $("statusCount").classList.add("hidden");
  }
  bar.classList.remove("hidden");

  /* 按钮 */
  const atHome=SCENARIO==="together_at_home";
  $("addBtn").disabled=atHome;
  $("readAllBtn").classList.toggle("hidden", !(unread.for_human>0));
  $("addHint").textContent=atHome
    ? "人都到家了,不用贴啦——等谁出门了,再往门上留纸条。"
    : (SCENARIO==="away" ? "你想给他的话也能贴,他一个人在家会看到。" : "");
}

/* ── 数据 ── */
async function loadData(){
  try{
    const d=await (await api("/app/fridge")).json();
    if(secret){ SNAPSHOT=d; }
  }catch(e){ if(e.message!=="401") err("加载失败:"+e.message); }
}
async function loadScenario(){
  try{
    const r=await fetch(API_BASE+"/app/loop_config",{headers:authHeaders()});
    if(r.status===401){ throw new Error("401"); }
    if(!r.ok){ SCENARIO=null; return; }
    const cfg=await r.json();
    const p=(cfg&&cfg.presence)||{};
    SCENARIO=(p.scenario==="together_at_home"||p.scenario==="away"||p.scenario==="together_out")?p.scenario:null;
  }catch(_){ SCENARIO=null; }
}
async function refresh(){ await Promise.all([loadData(),loadScenario()]); render(); }

function err(msg){ $("errLine").textContent=msg; $("errLine").classList.toggle("hidden",!msg); }

/* ── 操作 ── */
async function addNote(text){
  await api("/app/fridge",{method:"POST",headers:authHeaders({"Content-Type":"application/json"}),
    body:JSON.stringify({text:text})});
}
async function readNote(id){
  await api("/app/fridge/read",{method:"POST",headers:authHeaders({"Content-Type":"application/json"}),
    body:JSON.stringify({ids:[id]})});
}
async function readAll(){
  await api("/app/fridge/read",{method:"POST",headers:authHeaders({"Content-Type":"application/json"}),
    body:JSON.stringify({who:"human"})});
}
async function tear(id){
  await api("/app/fridge/"+id,{method:"DELETE"});
}

/* ── SSE:AI 贴纸条时实时长出来 ── */
function openStream(){
  if(!secret) return;
  try{
    const es=new EventSource(API_BASE+"/app/stream?token="+encodeURIComponent(secret));
    es.onmessage=(e)=>{
      try{
        const d=JSON.parse(e.data);
        if(d && d.type==="fridge"){ SNAPSHOT={notes:d.notes||[],unread:d.unread||{for_human:0,for_ai:0}}; render(); }
      }catch(_){}
    };
    window.addEventListener("pagehide",()=>es.close());
  }catch(_){}
}

/* ── 贴纸条 modal ── */
function openWrite(){
  $("noteText").value=""; $("noteCnt").textContent="0"; $("writeStatus").textContent="";
  $("writeTip").textContent=SCENARIO==="away"
    ? "他一个人在家。话不用长,是提醒也是惦记。"
    : (SCENARIO==="together_out" ? "回来时,你们一起看。" : "贴在门上,留给他读。");
  $("writeModal").classList.remove("hidden");
  setTimeout(()=>$("noteText").focus(),60);
}
function closeWrite(){ $("writeModal").classList.add("hidden"); }
$("noteText").addEventListener("input",()=>{
  $("noteCnt").textContent=$("noteText").value.length;
  $("writeStatus").textContent="";
});
async function doWrite(){
  const t=$("noteText").value.trim();
  if(!t){ $("writeStatus").textContent="纸条不能是空的。"; return; }
  $("writeSend").disabled=true; $("writeStatus").textContent="贴上中…";
  try{
    await addNote(t);
    closeWrite();
    refresh();
  }catch(e){
    $("writeStatus").textContent=e.message==="401"?"":("没贴上:"+e.message);
  }finally{ $("writeSend").disabled=false; }
}

/* ── 接线 ── */
$("topBack").onclick=()=>{ location.assign("index.html"); };
$("addBtn").onclick=openWrite;
$("readAllBtn").onclick=async()=>{ try{ await readAll(); refresh(); }catch(e){ err("标记失败:"+e.message); } };
$("writeClose").onclick=closeWrite;
$("writeCancel").onclick=closeWrite;
$("writeSend").onclick=doWrite;
$("writeModal").addEventListener("click",e=>{ if(e.target===$("writeModal")) closeWrite(); });
$("gateHome").onclick=()=>location.assign("index.html");
$("gateSave").onclick=()=>{ const v=$("gateInput").value.trim(); if(v){ secret=v; localStorage.setItem(LS_KEY,v); boot(); } };

/* 回前台时刷新(场景可能在聊天页切过) */
document.addEventListener("visibilitychange",()=>{ if(!document.hidden&&secret) refresh(); });
setInterval(()=>{ if(secret&&!document.hidden) refresh(); },30000);

/* ── 启动 ── */
async function boot(){
  if(!secret){ show("gate"); return; }
  show("main");
  await refresh();
  openStream();
}
boot();
</script>
