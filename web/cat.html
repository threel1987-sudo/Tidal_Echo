<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>猫咪 · Our Cat</title>

<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5/400.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5/500.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5/600.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@fontsource/noto-sans-sc@5/400.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@fontsource/noto-sans-sc@5/500.min.css" rel="stylesheet">
<link rel="preload" href="beach.webp" as="image">
<meta name="theme-color" content="#050D14">

<script>
  /* Tidal Echo — dark glassmorphism theme (single preset). */
  (function(){ document.documentElement.setAttribute("data-theme","tide"); })();
</script>

<style>
/* ───────── Tidal Echo · dark glassmorphism (shared with the PWA) ───────── */
:root{
  --font-en:"Inter","Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --font-cn:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;

  --bg:#050D14;
  --wall:url("beach.webp");
  --text:#F2F0EE;
  --text-soft:#B8B8C0;
  --text-faint:#808088;
  --accent:#A8CCE0;
  --accent-deep:#A8CCE0;
  --accent-fg:#0A1620;
  --hairline:rgba(255,255,255,.10);
  --field-bg:rgba(255,255,255,.12);
  --field-line:rgba(255,255,255,.12);
  --sheet-bg:rgba(16,26,36,.94);
  --sheet-line:rgba(255,255,255,.14);
  --sheet-hi:rgba(255,255,255,.16);
  --sheet-scrim:rgba(0,0,0,.50);
  --shadow:0 18px 46px rgba(0,0,0,.28);
  --soft-shadow:0 14px 34px rgba(0,0,0,.20);
  --scrim:linear-gradient(180deg,rgba(5,13,20,.55) 0%,rgba(5,13,20,.28) 30%,rgba(5,13,20,.28) 68%,rgba(5,13,20,.55) 100%);
  --danger:#E08A96;
  /* 猫咪专用 */
  --fur-a:#F0C891;
  --fur-b:#C98D54;
  --warm:#EFBE8F;
}

*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; padding:0; }
body{
  background:var(--bg); color:var(--text);
  font-family:var(--font-cn); font-size:15px; line-height:1.6;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  min-height:100vh; overflow-x:hidden;
}
.wall{ position:fixed; inset:0; z-index:-2; background:var(--bg) var(--wall) center/cover no-repeat; }
.wall::after{ content:""; position:absolute; inset:0; background:var(--scrim); }
button{ font:inherit; color:inherit; cursor:pointer; border:none; background:none; }
.hidden{ display:none !important; }

.glass{ background:var(--field-bg); border:1px solid var(--field-line);
  box-shadow:var(--soft-shadow), inset 0 1px 0 var(--sheet-hi);
  -webkit-backdrop-filter:blur(16px) saturate(1.25); backdrop-filter:blur(16px) saturate(1.25); }

/* ───────── 顶栏 ───────── */
.bar{
  position:sticky; top:0; z-index:30; display:flex; align-items:flex-start; gap:6px;
  padding:calc(8px + env(safe-area-inset-top)) clamp(16px,5vw,28px) 4px;
  background:linear-gradient(180deg,rgba(5,13,20,.72),rgba(5,13,20,0));
  -webkit-backdrop-filter:blur(12px) saturate(1.15); backdrop-filter:blur(12px) saturate(1.15);
}
.bar .icon{ width:36px; height:36px; margin-top:-3px; margin-left:-7px; display:grid; place-items:center;
  border-radius:50%; color:var(--text-soft); transition:background .2s; }
.bar .icon:active{ background:var(--hairline); }
.bar .icon svg{ width:22px; height:22px; }
.bar .grow{ flex:1; }
.top-label{ font-family:var(--font-en); font-size:10.5px; letter-spacing:.32em; text-align:right;
  color:var(--text-faint); text-transform:uppercase; line-height:1.5; padding-top:2px; }
.top-label .rule{ display:block; width:100%; height:1px; margin-top:3px;
  background:linear-gradient(90deg,transparent,var(--text-faint)); }

/* ───────── 布局 ───────── */
.wrap{ max-width:560px; margin:0 auto; padding:6px clamp(16px,5vw,28px) calc(30px + env(safe-area-inset-bottom)); }
.hero{ text-align:center; padding:26px 0 18px; }
.hero h1{ font-family:var(--font-en); font-weight:500; font-style:italic; font-size:clamp(30px,8vw,40px);
  letter-spacing:.01em; margin:0; }
.hero .sub{ font-family:var(--font-en); font-style:italic; font-size:13px; color:var(--text-faint); margin-top:5px; }

/* ───────── 猫卡 ───────── */
.card{ border-radius:26px; padding:26px 20px 22px; text-align:center; animation:sheetIn .4s cubic-bezier(.22,1,.36,1) both; }
.face{ position:relative; width:118px; height:118px; margin:0 auto; border-radius:50%;
  background:radial-gradient(circle at 38% 32%, var(--fur-a), var(--fur-b));
  box-shadow:0 12px 30px rgba(201,141,84,.30), inset 0 2px 6px rgba(255,255,255,.35);
  display:grid; place-items:center; animation:breathe 3.6s ease-in-out infinite; }
.face svg{ width:72px; height:72px; }
.face .zzz{ position:absolute; top:-4px; right:-8px; font-family:var(--font-en); font-style:italic;
  font-size:15px; color:var(--warm); letter-spacing:.06em; animation:floatz 2.4s ease-in-out infinite; }
.cname{ font-family:var(--font-cn); font-weight:500; font-size:23px; margin:14px 0 2px; }
.csince{ font-family:var(--font-en); font-style:italic; font-size:11.5px; color:var(--text-faint); letter-spacing:.05em; }

.now{ margin:16px auto 0; max-width:340px; background:rgba(255,255,255,.07); border:1px solid var(--hairline);
  border-radius:16px; padding:12px 14px; }
.now .do{ font-size:14.5px; line-height:1.65; }
.now .mood{ display:inline-block; margin-top:7px; font-size:11.5px; padding:3px 11px; border-radius:20px;
  background:rgba(240,200,145,.14); color:var(--warm); }

.meters{ display:flex; gap:10px; margin:14px 0 0; }
.meter{ flex:1; background:rgba(255,255,255,.07); border:1px solid var(--hairline); border-radius:14px; padding:10px 8px 9px; }
.meter .lab{ font-size:11.5px; color:var(--text-faint); letter-spacing:.08em; }
.meter .dots{ margin-top:5px; font-size:12px; letter-spacing:.28em; color:var(--warm); }
.meter .dots .off{ color:rgba(255,255,255,.16); }
.meter .val{ margin-top:3px; font-size:12px; color:var(--text-soft); }

.times{ margin-top:12px; font-size:12px; color:var(--text-faint); line-height:1.8; }
.chips{ display:flex; flex-wrap:wrap; gap:7px; justify-content:center; margin-top:14px; }
.chip{ font-size:12px; color:var(--text-soft); background:rgba(255,255,255,.08);
  border:1px solid var(--hairline); border-radius:20px; padding:4px 12px; }

/* ───────── 空状态 ───────── */
.empty{ border-radius:26px; padding:44px 24px 34px; text-align:center; animation:sheetIn .4s both; }
.empty svg{ width:58px; height:58px; color:var(--text-faint); opacity:.8; margin:0 auto; display:block; }
.empty .en{ font-family:var(--font-en); font-style:italic; font-size:16px; color:var(--text-faint); margin-top:12px; }
.empty p{ font-size:13px; color:var(--text-soft); margin:8px 0 0; line-height:1.8; }

/* ───────── 底部操作 ───────── */
.acts{ display:flex; gap:10px; margin:16px 0 8px; }
.acts button{ flex:1; padding:13px; border-radius:15px; font-size:13.5px; letter-spacing:.02em;
  transition:transform .15s; display:flex; align-items:center; justify-content:center; gap:6px; }
.acts button svg{ width:15px; height:15px; }
.acts button:active{ transform:scale(.96); }
.acts button.on{ background:linear-gradient(160deg,var(--fur-a),var(--fur-b)); color:#3A2410; box-shadow:var(--soft-shadow); font-weight:500; }
.acts button:disabled{ opacity:.45; }
.hint{ text-align:center; font-size:12px; color:var(--text-faint); margin:6px 0 2px; }

/* ───────── modal ───────── */
.modal{ position:fixed; inset:0; z-index:70; display:grid; place-items:center; padding:18px;
  background:var(--sheet-scrim); -webkit-backdrop-filter:blur(7px); backdrop-filter:blur(7px); animation:fade .25s; }
.sheet{ position:relative; width:100%; max-width:430px; max-height:88vh; overflow-y:auto; border-radius:24px; padding:24px 20px 22px;
  background:var(--sheet-bg); border:1px solid var(--sheet-line);
  box-shadow:var(--shadow), inset 0 1px 0 var(--sheet-hi);
  -webkit-backdrop-filter:blur(28px) saturate(1.3); backdrop-filter:blur(28px) saturate(1.3);
  animation:sheetIn .32s cubic-bezier(.22,1,.36,1) both; }
.sheet-x{ position:absolute; top:13px; right:13px; width:30px; height:30px; display:grid; place-items:center;
  border-radius:50%; color:var(--text-soft); font-size:19px; line-height:1; }
.sheet-x:active{ background:var(--hairline); }
.sheet .fh{ font-weight:500; font-size:19px; text-align:center; margin:0 0 3px; }
.sheet .fsub{ font-family:var(--font-en); font-style:italic; font-size:13px; color:var(--text-faint); text-align:center; margin:0 0 16px; }
.fld{ margin-bottom:12px; }
.fld .lb{ font-size:12px; color:var(--text-faint); margin:0 2px 5px; }
.fld input{ width:100%; padding:11px 14px; border:1px solid var(--field-line); border-radius:12px;
  background:var(--field-bg); color:var(--text); font-family:var(--font-cn); font-size:14px; outline:none; }
.fld input:focus{ border-color:rgba(240,200,145,.5); }
.sheet .row{ display:flex; gap:10px; margin-top:18px; }
.sheet .row button{ flex:1; padding:12px; border-radius:13px; font-size:14px; transition:transform .15s; }
.sheet .row button:active{ transform:scale(.96); }
.sheet .row .ghost{ flex:0 0 38%; background:var(--field-bg); border:1px solid var(--field-line); color:var(--text-soft);
  box-shadow:inset 0 1px 0 var(--sheet-hi); }
.sheet .row .send{ background:linear-gradient(160deg,var(--fur-a),var(--fur-b)); color:#3A2410; font-weight:500; box-shadow:var(--soft-shadow); }
.sheet .status{ margin-top:12px; font-size:12.5px; color:var(--text-soft); text-align:center; min-height:1.1em; }

/* gate 门 */
.gatebox{ background:var(--sheet-bg); border:1px solid var(--sheet-line); border-radius:22px; padding:22px 20px;
  box-shadow:var(--shadow), inset 0 1px 0 var(--sheet-hi); -webkit-backdrop-filter:blur(20px); backdrop-filter:blur(20px); margin-top:8px; }
.gatebox p{ font-size:13px; color:var(--text-soft); text-align:center; margin:0 0 14px; line-height:1.6; }
.gatebox input{ width:100%; padding:11px 14px; border:1px solid var(--field-line); border-radius:12px;
  background:var(--field-bg); color:var(--text); font-family:var(--font-cn); font-size:14px; outline:none; }
.gatebox .row{ display:flex; gap:10px; margin-top:14px; }
.gatebox .row button{ flex:1; padding:12px; border-radius:13px; font-size:14px; transition:transform .15s; }
.gatebox .row button:active{ transform:scale(.96); }
.gatebox .row .ghost{ background:var(--field-bg); border:1px solid var(--field-line); color:var(--text-soft); }
.gatebox .row .send{ background:var(--accent-deep); color:var(--accent-fg); }

/* 动画 */
@keyframes fade{ from{ opacity:0; } }
@keyframes sheetIn{ from{ opacity:0; transform:translateY(20px) scale(.97); } }
@keyframes breathe{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.035); } }
@keyframes floatz{ 0%,100%{ opacity:.4; transform:translateY(0); } 50%{ opacity:1; transform:translateY(-4px); } }
@media (prefers-reduced-motion:reduce){ *{ animation:none !important; } }
</style>
</head>
<body>
<div class="wall"></div>

<!-- 顶栏 -->
<div class="bar">
  <button class="icon" id="topBack" title="返回">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
  </button>
  <span class="grow"></span>
  <div class="top-label" id="topLabel">OUR<br>CAT<span class="rule"></span></div>
</div>

<!-- ════════ 主页 ════════ -->
<div class="wrap" id="mainView">
  <div class="hero">
    <h1>Our Cat</h1>
    <div class="sub">a little heartbeat at home</div>
  </div>

  <!-- 没猫:空状态 -->
  <div class="empty glass hidden" id="emptyView">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 9.2 4.6 4.2l3.9 2.4a8.6 8.6 0 0 1 7 0l3.9-2.4-.9 5A7.6 7.6 0 1 1 5.5 9.2Z"/><circle cx="9.4" cy="13" r=".7" fill="currentColor" stroke="none"/><circle cx="14.6" cy="13" r=".7" fill="currentColor" stroke="none"/><path d="M11 16.2c.6.5 1.4.5 2 0"/></svg>
    <div class="en">no cat yet</div>
    <p>家里还没有猫咪。<br>等你们一起把它挑回来,在这里给它登记一个名字——<br>它就会真的在这个家里住下:会饿、会睡、会在门口等你们。</p>
  </div>

  <!-- 有猫:猫卡 -->
  <div class="card glass hidden" id="catView">
    <div class="face">
      <svg viewBox="0 0 24 24" fill="none" stroke="#4A2E14" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 9.2 4.6 4.2l3.9 2.4a8.6 8.6 0 0 1 7 0l3.9-2.4-.9 5A7.6 7.6 0 1 1 5.5 9.2Z"/><circle cx="9.4" cy="13" r=".8" fill="#4A2E14" stroke="none"/><circle cx="14.6" cy="13" r=".8" fill="#4A2E14" stroke="none"/><path d="M11 16.2c.6.5 1.4.5 2 0"/><path d="M7.5 15.5l-2.5.8M7.8 14.2l-2.6-.2M16.5 15.5l2.5.8M16.2 14.2l2.6-.2"/></svg>
      <span class="zzz hidden" id="catZzz">z z z</span>
    </div>
    <div class="cname" id="catName"></div>
    <div class="csince" id="catSince"></div>

    <div class="now">
      <div class="do" id="catNow"></div>
      <span class="mood" id="catMood"></span>
    </div>

    <div class="meters">
      <div class="meter">
        <div class="lab">饱食</div>
        <div class="dots" id="catFoodDots"></div>
        <div class="val" id="catFoodVal"></div>
      </div>
      <div class="meter">
        <div class="lab">亲昵</div>
        <div class="dots" id="catLoveDots"></div>
        <div class="val" id="catLoveVal"></div>
      </div>
    </div>

    <div class="times" id="catTimes"></div>
    <div class="chips" id="catChips"></div>
  </div>

  <div class="acts hidden" id="catActs">
    <button class="glass" id="feedBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5a8 3.5 0 0 0 16 0"/><path d="M4 12.5V14a8 4.5 0 0 0 16 0v-1.5"/><path d="M9 8c.5-1.5 2-1.5 2.5 0M13.5 7c.5-1.5 2-1.5 2.5 0"/></svg>
      喂一顿
    </button>
    <button class="on" id="petBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7-4.3-9.2-8.5C1.2 8.4 3 5 6.4 5c2 0 3.6 1.2 4.4 2.6h2.4C14 6.2 15.6 5 17.6 5 21 5 22.8 8.4 21.2 11.5 19 15.7 12 20 12 20Z"/></svg>
      摸一摸
    </button>
  </div>

  <div class="acts hidden" id="adoptActs">
    <button class="on" id="adoptBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      把猫咪接回家
    </button>
  </div>

  <div class="hint" id="liveHint"></div>
  <div class="hint hidden" id="errLine" style="color:var(--danger)"></div>
</div>

<!-- ════════ token 门 ════════ -->
<div class="wrap gate hidden" id="gateView">
  <div class="hero" style="padding-top:40px"><h1>Our Cat</h1><div class="sub">a little heartbeat at home</div></div>
  <div class="gatebox">
    <p>没读到访问密钥——先在主页登录，或在此粘贴密钥（与 PWA 同一个）。</p>
    <input type="text" id="gateInput" placeholder="访问密钥">
    <p class="hidden" id="gateErr" style="color:var(--danger);font-size:12.5px;text-align:center;margin:10px 0 0"></p>
    <div class="row">
      <button class="ghost" id="gateHome">去主页</button>
      <button class="send" id="gateSave">保存并进入</button>
    </div>
  </div>
</div>

<!-- ════════ 领养 modal ════════ -->
<div class="modal hidden" id="adoptModal">
  <div class="sheet">
    <button class="sheet-x" id="adoptClose" aria-label="关闭">✕</button>
    <div class="fh">把猫咪接回家</div>
    <div class="fsub">register the newest member of the family</div>
    <div class="fld">
      <p class="lb">名字(必填)</p>
      <input type="text" id="fldName" maxlength="40" placeholder="它叫什么?">
    </div>
    <div class="fld">
      <p class="lb">毛色</p>
      <input type="text" id="fldColor" maxlength="40" placeholder="橘白 / 奶牛 / 三花…">
    </div>
    <div class="fld">
      <p class="lb">年龄</p>
      <input type="text" id="fldAge" maxlength="60" placeholder="两个月大的小奶猫">
    </div>
    <div class="fld">
      <p class="lb">性格</p>
      <input type="text" id="fldPersonality" maxlength="120" placeholder="黏人、胆小、还是个小霸王?">
    </div>
    <div class="row">
      <button class="ghost" id="adoptCancel">再想想</button>
      <button class="send" id="adoptSend">接它回家</button>
    </div>
    <div class="status" id="adoptStatus"></div>
  </div>
</div>

<script>
/* ─────────────────────────────────────────────────────────────
   Our Cat — 电子宠物猫卡。
   状态存在 home_state 插件(经 relay /app/cat 代理):
   · 生命引擎按真实时间推导:会饿、深夜会睡、久没人理会寂寞。
   · 喂一顿 / 摸一摸 = 记一次时间戳,状态自动回升。
   ───────────────────────────────────────────────────────────── */
const API_BASE="/relay";
const LS_KEY="companion_secret";
let secret=localStorage.getItem(LS_KEY)||"";

const $=(id)=>document.getElementById(id);
function authHeaders(extra){ return Object.assign({"Authorization":"Bearer "+secret}, extra||{}); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

async function api(path,opts){
  const o=Object.assign({}, opts||{}, {headers:authHeaders((opts&&opts.headers)||{})});
  const r=await fetch(API_BASE+path, o);
  if(r.status===401){
    secret=""; localStorage.removeItem(LS_KEY);
    const g=$("gateErr"); if(g){ g.textContent="密钥没通过验证,刚才的操作没有执行——重新输入正确的密钥再试。"; g.classList.remove("hidden"); }
    show("gate"); throw new Error("401");
  }
  if(!r.ok){ let d=""; try{ d=(await r.json()).detail; }catch(_){} throw new Error(d||("HTTP "+r.status)); }
  return r;
}

function show(name){
  $("mainView").classList.toggle("hidden", name!=="main");
  $("gateView").classList.toggle("hidden", name!=="gate");
  window.scrollTo(0,0);
}

/* ── 状态 ── */
let CAT=null;          // 猫视图(档案 + 派生状态);null = 没猫
let CAT_ENABLED=false;

function fmtAgo(hours){
  if(hours==null) return "";
  const m=Math.round(hours*60);
  if(m<60) return m+" 分钟前";
  const h=Math.round(hours*10)/10;
  if(h<24) return h+" 小时前";
  return Math.round(h/24)+" 天前";
}
function dots(level){  // level 0..3
  let s="";
  for(let i=0;i<3;i++) s+= i<level ? "●" : "<span class='off'>●</span>";
  return s;
}

/* ── 渲染 ── */
function render(){
  const hasCat=!!CAT;
  $("emptyView").classList.toggle("hidden", hasCat);
  $("adoptActs").classList.toggle("hidden", hasCat);
  $("catView").classList.toggle("hidden", !hasCat);
  $("catActs").classList.toggle("hidden", !hasCat);
  $("liveHint").textContent = hasCat
    ? "它的状态跟着真实时间走:会饿、深夜会睡、久没人陪会想你。"
    : (CAT_ENABLED ? "" : "登记之后,它就会在阿克的眼睛里也真实存在。");

  if(!hasCat) return;

  $("catName").textContent=CAT.name||"(还没名字)";
  $("catSince").textContent=CAT.adopted_at?("since "+String(CAT.adopted_at).slice(0,10)):"";
  $("catNow").textContent=CAT.summary?String(CAT.summary).split(";")[0]:"";
  $("catMood").textContent="心情 · "+(CAT.mood||"平静");
  $("catZzz").classList.toggle("hidden", !CAT.sleeping);

  $("catFoodDots").innerHTML=dots(3-(CAT.hunger??1));
  $("catFoodVal").textContent=CAT.hunger_label||"";
  $("catLoveDots").innerHTML=dots(3-(CAT.lonely??0));
  $("catLoveVal").textContent=CAT.company_label||"";

  const bits=[];
  bits.push(CAT.fed_hours_ago!=null ? "上次喂食 "+fmtAgo(CAT.fed_hours_ago) : "还没喂过它");
  bits.push(CAT.petted_hours_ago!=null ? "上次亲近 "+fmtAgo(CAT.petted_hours_ago) : "还没摸过它");
  $("catTimes").textContent=bits.join(" · ");

  const chips=[];
  if(CAT.color) chips.push(CAT.color);
  if(CAT.age) chips.push(CAT.age);
  if(CAT.personality) chips.push(CAT.personality);
  $("catChips").innerHTML=chips.map(c=>`<span class="chip">${esc(c)}</span>`).join("");
}

/* ── 数据 ── */
async function loadData(){
  try{
    const d=await (await api("/app/cat")).json();
    if(secret){
      CAT_ENABLED=!!(d&&d.cat_enabled);
      CAT=(d&&d.cat&&typeof d.cat==="object")?d.cat:null;
    }
  }catch(e){ if(e.message!=="401") err("加载失败:"+e.message); }
}
async function refresh(){ await loadData(); render(); }

function err(msg){ $("errLine").textContent=msg; $("errLine").classList.toggle("hidden",!msg); }

/* ── 操作 ── */
async function act(action,fields,btn){
  btn.disabled=true;
  try{
    const d=await (await api("/app/cat/action",{method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify(Object.assign({action:action},fields||{}))})).json();
    CAT_ENABLED=!!(d&&d.cat_enabled);
    CAT=(d&&d.cat&&typeof d.cat==="object")?d.cat:null;
    render();
  }finally{ btn.disabled=false; }
}

/* ── SSE:阿克那边喂了/摸了,卡片实时更新 ── */
function openStream(){
  if(!secret) return;
  try{
    const es=new EventSource(API_BASE+"/app/stream?token="+encodeURIComponent(secret));
    es.onmessage=(e)=>{
      try{
        const d=JSON.parse(e.data);
        if(d && d.type==="cat"){
          CAT_ENABLED=!!d.cat_enabled;
          CAT=(d.cat&&typeof d.cat==="object")?d.cat:null;
          render();
        }
      }catch(_){}
    };
    window.addEventListener("pagehide",()=>es.close());
  }catch(_){}
}

/* ── 领养 modal ── */
function openAdopt(){
  ["fldName","fldColor","fldAge","fldPersonality"].forEach(id=>$(id).value="");
  $("adoptStatus").textContent="";
  $("adoptModal").classList.remove("hidden");
  setTimeout(()=>$("fldName").focus(),60);
}
function closeAdopt(){ $("adoptModal").classList.add("hidden"); }
async function doAdopt(){
  const name=$("fldName").value.trim();
  if(!name){ $("adoptStatus").textContent="接猫回家要给它一个名字呀。"; return; }
  $("adoptSend").disabled=true; $("adoptStatus").textContent="正在给它办入住…";
  try{
    await act("adopt",{
      name:name,
      color:$("fldColor").value.trim(),
      age:$("fldAge").value.trim(),
      personality:$("fldPersonality").value.trim(),
    },$("adoptSend"));
    closeAdopt();
  }catch(e){
    $("adoptStatus").textContent=e.message==="401"?"":("没接上:"+e.message);
  }finally{ $("adoptSend").disabled=false; }
}

/* ── 接线 ── */
$("topBack").onclick=()=>{
  if (document.referrer && document.referrer.indexOf(location.origin) === 0) history.back();
  else location.assign("index.html");
};
$("adoptBtn").onclick=openAdopt;
$("adoptClose").onclick=closeAdopt;
$("adoptCancel").onclick=closeAdopt;
$("adoptSend").onclick=doAdopt;
$("adoptModal").addEventListener("click",e=>{ if(e.target===$("adoptModal")) closeAdopt(); });
$("feedBtn").onclick=async()=>{ try{ await act("feed",{},$("feedBtn")); }catch(e){ if(e.message!=="401") err("没喂成:"+e.message); } };
$("petBtn").onclick=async()=>{ try{ await act("pet",{},$("petBtn")); }catch(e){ if(e.message!=="401") err("没摸成:"+e.message); } };
$("gateHome").onclick=()=>location.assign("index.html");
$("gateSave").onclick=()=>{ const v=$("gateInput").value.trim(); if(v){ secret=v; localStorage.setItem(LS_KEY,v); boot(); } };

/* 状态随时间推导,回前台 / 每分钟刷一次 */
document.addEventListener("visibilitychange",()=>{ if(!document.hidden&&secret) refresh(); });
setInterval(()=>{ if(secret&&!document.hidden) refresh(); },60000);

/* ── 启动 ── */
async function boot(){
  if(!secret){ show("gate"); return; }
  $("gateErr").classList.add("hidden");
  show("main");
  await refresh();
  openStream();
}
boot();
</script>
</body>
</html>
