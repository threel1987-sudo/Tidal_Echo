/* @dark-only */
/* Source: structured-spec */
/* Project-local bridge: Motra library tokens + Tailwind semantic aliases */

:root {
  /* ── Reference & viewport ── */
  --screen-height: 100vh;
  --keyboard-offset: 0px;
  --ios-pwa-bottom-bleed: 0px;
  --ref-width: 941px;
  --ref-height: 1672px;

  /* ── Typography ── */
  --font-en: "Inter", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-cn: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-script: "Inter", "Noto Sans SC", system-ui, sans-serif;
  --fs-scale: 1;

  /* ── Wallpaper / assets ── */
  --wall-light: url("../assets/beach.jpg");
  --wall-harbor: url("../assets/beach.jpg");
  --wall-default: var(--wall-light);
  --menu-wall-light: url("../assets/beach.jpg");
  --menu-wall-harbor: url("../assets/beach.jpg");
  --menu-wall-default: var(--menu-wall-light);
  --avatar-default: url("../assets/avatar-sea.jpg");
  --wall: url("../assets/beach.jpg");

  /* ── MOTRA · 星辰之语(深色海岸玻璃拟态) ── */
  --bg: #050D14;
  --header-bg: rgba(5, 13, 20, .00);
  --hairline: rgba(255, 255, 255, .10);
  --text: #F2F0EE;
  --text-soft: #B8B8C0;
  --text-faint: #808088;
  --accent: #A8CCE0;
  --accent-deep: #A8CCE0;
  --accent-fg: #0A1620;
  --send-bg: #A8CCE0;
  --tick: #8EB8D0;
  --danger: #E08A96;

  /* Messages / bubbles */
  --bubble-ai-bg: rgba(255, 255, 255, .14);
  --bubble-ai-fg: #F2F0EE;
  --bubble-ai-line: rgba(255, 255, 255, .08);
  --bubble-human-bg: rgba(168, 204, 224, .26);
  --bubble-human-fg: #F2F0EE;
  --bubble-human-line: transparent;

  /* Thinking / meta cards */
  --think-flourish: rgba(168, 204, 224, .45);
  --think-label: #A8CCE0;
  --think-body: #B8B8C0;

  /* Composer / fields */
  --composer-bg: rgba(255, 255, 255, .12);
  --field-bg: rgba(255, 255, 255, .12);
  --field-line: rgba(255, 255, 255, .12);

  /* Atmosphere */
  --shadow: 0 18px 46px rgba(0, 0, 0, .28);
  --shadow-soft: 0 14px 34px rgba(0, 0, 0, .20);
  --scrim: linear-gradient(180deg, rgba(5, 13, 20, .55) 0%, rgba(5, 13, 20, .28) 30%, rgba(5, 13, 20, .28) 68%, rgba(5, 13, 20, .55) 100%);

  /* ── Spacing ── */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;

  /* ── Border radius ── */
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 24px;
  --radius-bubble: clamp(14px, 2vw, 20px);

  /* ── Shadows ── */
  --shadow-1: 0 4px 12px rgba(0, 0, 0, .15);
  --shadow-2: 0 14px 34px rgba(0, 0, 0, .20);
  --shadow-3: 0 18px 46px rgba(0, 0, 0, .28);

  /* ── Layout ── */
  --header-h: clamp(56px, 10vw, 120px);
  --side-pad: clamp(16px, 4vw, 40px);
  --avatar-size: clamp(32px, 5vw, 48px);
  --composer-h: clamp(44px, 6vw, 72px);
  --composer-zone: calc(var(--composer-h) + 36px + env(safe-area-inset-bottom) + var(--keyboard-offset));
  --edge-fade-top: clamp(24px, 5vw, 52px);
  --edge-fade-tail: clamp(16px, 3vw, 30px);

  /* ── Motion ── */
  --motion-fast: 150ms;
  --motion-normal: 260ms;
  --ease-soft: cubic-bezier(0.22, 1, 0.36, 1);

  /* ── Profile / settings ── */
  --card-bg: rgba(255, 255, 255, .14);
  --card-line: rgba(255, 255, 255, .12);
  --card-shadow: 0 10px 28px rgba(0, 0, 0, .25);
  --seg-track: rgba(255, 255, 255, .10);
  --seg-thumb: rgba(168, 204, 224, .30);
  --seg-thumb-shadow: 0 2px 8px rgba(0, 0, 0, .25);
  --row-press: rgba(255, 255, 255, .08);
  --slider-track: rgba(255, 255, 255, .16);
  --slider-thumb: #A8CCE0;
  --info-ring: rgba(168, 204, 224, .38);
  --status-dot: #A8D8C0;

  /* ── Sheet / modal shared ── */
  --sheet-bg: rgba(16, 26, 36, .94);
  --sheet-line: rgba(255, 255, 255, .14);
  --sheet-hi: rgba(255, 255, 255, .16);
  --sheet-scrim: rgba(0, 0, 0, .50);

  /* ── Tailwind / semantic aliases (prefixless) ── */
  --background: var(--bg);
  --foreground: var(--text);
  --card: var(--card-bg);
  --card-foreground: var(--text);
  --popover: var(--sheet-bg);
  --popover-foreground: var(--text);
  --primary: var(--accent);
  --primary-foreground: var(--accent-fg);
  --secondary: var(--card-bg);
  --secondary-foreground: var(--text);
  --muted: var(--text-soft);
  --muted-foreground: var(--text-faint);
  --accent: var(--accent);
  --accent-foreground: var(--accent-fg);
  --destructive: var(--danger);
  --destructive-foreground: var(--text);
  --border: var(--hairline);
  --input: var(--field-bg);
  --ring: var(--accent);

  /* ── Layer 3 portable aliases ── */
  --color-bg: var(--bg);
  --color-header-bg: var(--header-bg);
  --color-surface: var(--card-bg);
  --color-surface-container: var(--sheet-bg);
  --color-text: var(--text);
  --color-on-surface: var(--text);
  --color-text-soft: var(--text-soft);
  --color-on-surface-variant: var(--text-soft);
  --color-text-faint: var(--text-faint);
  --color-accent: var(--accent);
  --color-primary: var(--accent);
  --color-accent-deep: var(--accent-deep);
  --color-primary-hover: var(--accent-deep);
  --color-accent-fg: var(--accent-fg);
  --color-primary-foreground: var(--accent-fg);
  --color-danger: var(--danger);
  --color-hairline: var(--hairline);
  --color-border: var(--hairline);
  --color-field-bg: var(--field-bg);
  --color-field-line: var(--field-line);
  --color-card-bg: var(--card-bg);
  --color-card-line: var(--card-line);
  --color-card-shadow: var(--card-shadow);
  --color-sheet-bg: var(--sheet-bg);
  --color-sheet-line: var(--sheet-line);
  --color-sheet-hi: var(--sheet-hi);
  --color-sheet-scrim: var(--sheet-scrim);
  --font-family-base: var(--font-cn);
  --font-family-display: var(--font-en);
  --font-family-script: var(--font-script);
  --type-scale: var(--fs-scale);
  --bubble-radius: clamp(14px, 2vw, 20px);
  --radius-bubble: var(--bubble-radius);
  --shadow-default: var(--shadow);
  --motion-fast: var(--motion-fast);
  --motion-normal: var(--motion-normal);
  --ease-soft: var(--ease-soft);
  --layout-header-h: var(--header-h);
  --layout-side-pad: var(--side-pad);
  --layout-avatar-size: var(--avatar-size);
  --layout-composer-h: var(--composer-h);
}

@media (max-width: 520px) {
  :root {
    --side-pad: 16px;
    --header-h: 68px;
    --avatar-size: 32px;
    --edge-fade-top: 10px;
  }
}

  <style>
    /* Page-scoped critical layout: static, no JS-driven reflow */
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: var(--font-family-base);
      background: var(--bg) url('../assets/beach.jpg') center/cover no-repeat fixed;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: var(--scrim);
      pointer-events: none;
      z-index: 0;
    }
    .settings-root {
      position: relative;
      z-index: 1;
      width: 100%;
      min-height: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .safe-top {
      height: env(safe-area-inset-top);
      min-height: 12px;
      flex-shrink: 0;
    }
    .safe-bottom {
      height: env(safe-area-inset-bottom);
      min-height: 8px;
      flex-shrink: 0;
    }

    /* Sticky glass nav bar */
    .nav-bar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      height: var(--header-h);
      min-height: 56px;
      padding: 0 var(--side-pad);
      background: rgba(5, 13, 20, .65);
      border-bottom: 1px solid var(--hairline);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
    }
    .nav-back {
      position: absolute;
      left: var(--side-pad);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      color: var(--text);
      background: transparent;
      border: none;
      cursor: pointer;
      transition: background var(--motion-fast);
      -webkit-tap-highlight-color: transparent;
    }
    .nav-back:hover { background: var(--row-press); }
    .nav-back:active { background: var(--row-press); transform: scale(0.95); }
    .nav-back svg { width: 24px; height: 24px; stroke-width: 1.8; }
    .nav-title {
      font-size: 17px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: 0.02em;
    }

    /* Scrollable content area */
    .settings-scroll {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: var(--space-4) var(--side-pad) var(--space-6);
    }
    .settings-content {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: var(--space-5);
    }

    /* iOS-style grouped card */
    .setting-group {
      background: var(--color-card-bg);
      border: 1px solid var(--color-card-line);
      border-radius: var(--radius-lg);
      box-shadow: var(--color-card-shadow);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      overflow: hidden;
    }
    .setting-row {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      min-height: 52px;
      padding: var(--space-3) var(--space-4);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: background var(--motion-fast);
      text-decoration: none;
      color: inherit;
    }
    .setting-row + .setting-row { border-top: 1px solid var(--color-card-line); }
    .setting-row:hover { background: var(--row-press); }
    .setting-row:active { background: rgba(255,255,255,.12); }
    .setting-row.destructive .setting-label { color: var(--danger); }
    .setting-row.destructive .setting-icon { background: rgba(224, 138, 150, .20); color: var(--danger); }

    .setting-icon {
      flex-shrink: 0;
      width: 30px;
      height: 30px;
      border-radius: var(--radius-sm);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--color-accent);
      background: rgba(168, 204, 224, .18);
    }
    .setting-icon svg { width: 17px; height: 17px; stroke-width: 1.8; }

    .setting-body {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .setting-label {
      font-size: 15px;
      font-weight: 500;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .setting-sub {
      font-size: 12px;
      color: var(--text-faint);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .setting-value {
      flex-shrink: 0;
      font-size: 14px;
      color: var(--text-soft);
      margin-right: var(--space-1);
    }
    .setting-chevron {
      flex-shrink: 0;
      width: 18px;
      height: 18px;
      color: var(--text-faint);
    }

    /* Profile row is taller */
    .setting-row.profile { min-height: 78px; }
    .profile-avatar {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: var(--avatar-default) center/cover no-repeat;
      border: 2px solid rgba(255,255,255,.18);
      box-shadow: 0 4px 14px rgba(0,0,0,.25);
      flex-shrink: 0;
    }
    .profile-status {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      color: var(--text-soft);
    }
    .profile-status::before {
      content: '';
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--status-dot);
      box-shadow: 0 0 0 2px rgba(168, 216, 192, .25);
    }

    /* Toggle switch */
    .toggle {
      appearance: none;
      -webkit-appearance: none;
      flex-shrink: 0;
      width: 50px;
      height: 30px;
      border-radius: 999px;
      background: rgba(255,255,255,.20);
      border: 1px solid rgba(255,255,255,.12);
      position: relative;
      cursor: pointer;
      transition: background var(--motion-fast), border-color var(--motion-fast);
      outline: none;
    }
    .toggle::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--text);
      box-shadow: 0 2px 6px rgba(0,0,0,.25);
      transition: transform var(--motion-fast) var(--ease-soft);
    }
    .toggle:checked {
      background: var(--color-accent);
      border-color: rgba(168, 204, 224, .45);
    }
    .toggle:checked::after {
      transform: translateX(20px);
      background: var(--accent-fg);
    }
    .toggle:focus-visible { box-shadow: 0 0 0 3px var(--info-ring); }

    .group-spacer { height: var(--space-1); }
  </style>

  <div class="settings-root">
    <div class="safe-top"></div>

    <header class="nav-bar">
      <a href="index.html" class="nav-back" data-dom-id="settings-back" aria-label="返回">
        <i data-lucide="chevron-left"></i>
      </a>
      <h1 class="nav-title">设置</h1>
    </header>

    <main class="settings-scroll no-scrollbar">
      <div class="settings-content">

        <!-- 个人资料 -->
        <section class="setting-group" data-dom-id="settings-profile" aria-label="个人资料">
          <a href="#" class="setting-row profile">
            <div class="profile-avatar" aria-hidden="true"></div>
            <div class="setting-body">
              <span class="setting-label">Motra</span>

            </div>
            <i data-lucide="chevron-right" class="setting-chevron"></i>
          </a>
        </section>

        <!-- 外观 -->
        <section class="setting-group" aria-label="外观">
          <a href="appearance.html" class="setting-row" data-dom-id="settings-appearance">
            <div class="setting-icon"><i data-lucide="palette"></i></div>
            <div class="setting-body">
              <span class="setting-label">外观</span>
              <span class="setting-sub">主题 · 配色 · 壁纸</span>
            </div>
            <span class="setting-value">深色海岸</span>
            <i data-lucide="chevron-right" class="setting-chevron"></i>
          </a>
          <a href="#" class="setting-row" data-dom-id="settings-fontsize">
            <div class="setting-icon"><i data-lucide="type"></i></div>
            <div class="setting-body">
              <span class="setting-label">字体大小</span>
            </div>
            <span class="setting-value">标准</span>
            <i data-lucide="chevron-right" class="setting-chevron"></i>
          </a>
        </section>

        <!-- 通知 -->
        <section class="setting-group" data-dom-id="settings-notifications" aria-label="通知">
          <label class="setting-row">
            <div class="setting-icon"><i data-lucide="bell"></i></div>
            <div class="setting-body">
              <span class="setting-label">消息通知</span>
            </div>
            <input type="checkbox" class="toggle" checked aria-label="消息通知">
          </label>
        </section>

        <!-- 数据与缓存 -->
        <section class="setting-group" aria-label="数据与缓存">
          <a href="#" class="setting-row" data-dom-id="settings-backup">
            <div class="setting-icon"><i data-lucide="cloud"></i></div>
            <div class="setting-body">
              <span class="setting-label">数据备份</span>
            </div>
            <span class="setting-value">已开启</span>
            <i data-lucide="chevron-right" class="setting-chevron"></i>
          </a>
          <a href="#" class="setting-row" data-dom-id="settings-clearcache">

              <span class="setting-label">清除缓存</span>
              <span class="setting-sub">当前缓存 24.6 MB</span>
            </div>
            <i data-lucide="chevron-right" class="setting-chevron"></i>
          </a>
        </section>

        <!-- AI 配置 -->
        <section class="setting-group" aria-label="AI 配置">
          <a href="#" class="setting-row" data-dom-id="settings-api">
            <div class="setting-icon"><i data-lucide="link"></i></div>
            <div class="setting-body">
              <span class="setting-label">API 链接</span>
            </div>
            <i data-lucide="chevron-right" class="setting-chevron"></i>
          </a>
          <a href="#" class="setting-row" data-dom-id="settings-mcp">
            <div class="setting-icon"><i data-lucide="cpu"></i></div>
            <div class="setting-body">
              <span class="setting-label">MCP 工具</span>
            </div>
            <i data-lucide="chevron-right" class="setting-chevron"></i>
          </a>
          <a href="#" class="setting-row" data-dom-id="settings-persona">
            <div class="setting-icon"><i data-lucide="bot"></i></div>
            <div class="setting-body">
              <span class="setting-label">AI 人设规则</span>
            </div>
            <i data-lucide="chevron-right" class="setting-chevron"></i>
          </a>
          <a href="#" class="setting-row" data-dom-id="settings-model">
            <div class="setting-icon"><i data-lucide="sliders-horizontal"></i></div>
            <div class="setting-body">
              <span class="setting-label">模型参数</span>
            </div>
            <i data-lucide="chevron-right" class="setting-chevron"></i>
          </a>
          <a href="#" class="setting-row" data-dom-id="settings-injection">
            <div class="setting-icon"><i data-lucide="terminal"></i></div>
            <div class="setting-body">
              <span class="setting-label">指令注入</span>
            </div>
            <i data-lucide="chevron-right" class="setting-chevron"></i>
          </a>
          <label class="setting-row" data-dom-id="settings-proactive">
            <div class="setting-icon"><i data-lucide="send"></i></div>
            <div class="setting-body">
              <span class="setting-label">主动消息</span>
            </div>
            <input type="checkbox" class="toggle" aria-label="主动消息">
          </label>
        </section>

        <!-- 账号 -->
        <section class="setting-group" aria-label="账号">
          <a href="#" class="setting-row destructive" data-dom-id="settings-logout">
            <div class="setting-icon"><i data-lucide="log-out"></i></div>
            <div class="setting-body">
              <span class="setting-label">退出登录</span>
            </div>
            <i data-lucide="chevron-right" class="setting-chevron"></i>
          </a>
        </section>

        <div class="group-spacer"></div>
      </div>
    </main>

    <div class="safe-bottom"></div>
  </div>

  <script>lucide.createIcons();</script>
</body>
