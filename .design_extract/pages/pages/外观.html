/* @dark-only */
/* Source: structured-spec */
/* Project-local bridge: Motra library tokens + Tailwind semantic aliases */

:root {
  /* ── Reference & viewport ── */
  --screen-height: 100vh;
  --keyboard-offset: 0px;
  --ios-pwa-bottom-bleed: 0px;
  --ref-width: 941px;
  --ref-height: 1672px;

  /* ── Typography ── */
  --font-en: "Inter", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-cn: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-script: "Inter", "Noto Sans SC", system-ui, sans-serif;
  --fs-scale: 1;

  /* ── Wallpaper / assets ── */
  --wall-light: url("../assets/beach.jpg");
  --wall-harbor: url("../assets/beach.jpg");
  --wall-default: var(--wall-light);
  --menu-wall-light: url("../assets/beach.jpg");
  --menu-wall-harbor: url("../assets/beach.jpg");
  --menu-wall-default: var(--menu-wall-light);
  --avatar-default: url("../assets/avatar-sea.jpg");
  --wall: url("../assets/beach.jpg");

  /* ── MOTRA · 星辰之语(深色海岸玻璃拟态) ── */
  --bg: #050D14;
  --header-bg: rgba(5, 13, 20, .00);
  --hairline: rgba(255, 255, 255, .10);
  --text: #F2F0EE;
  --text-soft: #B8B8C0;
  --text-faint: #808088;
  --accent: #A8CCE0;
  --accent-deep: #A8CCE0;
  --accent-fg: #0A1620;
  --send-bg: #A8CCE0;
  --tick: #8EB8D0;
  --danger: #E08A96;

  /* Messages / bubbles */
  --bubble-ai-bg: rgba(255, 255, 255, .14);
  --bubble-ai-fg: #F2F0EE;
  --bubble-ai-line: rgba(255, 255, 255, .08);
  --bubble-human-bg: rgba(168, 204, 224, .26);
  --bubble-human-fg: #F2F0EE;
  --bubble-human-line: transparent;

  /* Thinking / meta cards */
  --think-flourish: rgba(168, 204, 224, .45);
  --think-label: #A8CCE0;
  --think-body: #B8B8C0;

  /* Composer / fields */
  --composer-bg: rgba(255, 255, 255, .12);
  --field-bg: rgba(255, 255, 255, .12);
  --field-line: rgba(255, 255, 255, .12);

  /* Atmosphere */
  --shadow: 0 18px 46px rgba(0, 0, 0, .28);
  --shadow-soft: 0 14px 34px rgba(0, 0, 0, .20);
  --scrim: linear-gradient(180deg, rgba(5, 13, 20, .55) 0%, rgba(5, 13, 20, .28) 30%, rgba(5, 13, 20, .28) 68%, rgba(5, 13, 20, .55) 100%);

  /* ── Spacing ── */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;

  /* ── Border radius ── */
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 24px;
  --radius-bubble: clamp(14px, 2vw, 20px);

  /* ── Shadows ── */
  --shadow-1: 0 4px 12px rgba(0, 0, 0, .15);
  --shadow-2: 0 14px 34px rgba(0, 0, 0, .20);
  --shadow-3: 0 18px 46px rgba(0, 0, 0, .28);

  /* ── Layout ── */
  --header-h: clamp(56px, 10vw, 120px);
  --side-pad: clamp(16px, 4vw, 40px);
  --avatar-size: clamp(32px, 5vw, 48px);
  --composer-h: clamp(44px, 6vw, 72px);
  --composer-zone: calc(var(--composer-h) + 36px + env(safe-area-inset-bottom) + var(--keyboard-offset));
  --edge-fade-top: clamp(24px, 5vw, 52px);
  --edge-fade-tail: clamp(16px, 3vw, 30px);

  /* ── Motion ── */
  --motion-fast: 150ms;
  --motion-normal: 260ms;
  --ease-soft: cubic-bezier(0.22, 1, 0.36, 1);

  /* ── Profile / settings ── */
  --card-bg: rgba(255, 255, 255, .14);
  --card-line: rgba(255, 255, 255, .12);
  --card-shadow: 0 10px 28px rgba(0, 0, 0, .25);
  --seg-track: rgba(255, 255, 255, .10);
  --seg-thumb: rgba(168, 204, 224, .30);
  --seg-thumb-shadow: 0 2px 8px rgba(0, 0, 0, .25);
  --row-press: rgba(255, 255, 255, .08);
  --slider-track: rgba(255, 255, 255, .16);
  --slider-thumb: #A8CCE0;
  --info-ring: rgba(168, 204, 224, .38);
  --status-dot: #A8D8C0;

  /* ── Sheet / modal shared ── */
  --sheet-bg: rgba(16, 26, 36, .94);
  --sheet-line: rgba(255, 255, 255, .14);
  --sheet-hi: rgba(255, 255, 255, .16);
  --sheet-scrim: rgba(0, 0, 0, .50);

  /* ── Tailwind / semantic aliases (prefixless) ── */
  --background: var(--bg);
  --foreground: var(--text);
  --card: var(--card-bg);
  --card-foreground: var(--text);
  --popover: var(--sheet-bg);
  --popover-foreground: var(--text);
  --primary: var(--accent);
  --primary-foreground: var(--accent-fg);
  --secondary: var(--card-bg);
  --secondary-foreground: var(--text);
  --muted: var(--text-soft);
  --muted-foreground: var(--text-faint);
  --accent: var(--accent);
  --accent-foreground: var(--accent-fg);
  --destructive: var(--danger);
  --destructive-foreground: var(--text);
  --border: var(--hairline);
  --input: var(--field-bg);
  --ring: var(--accent);

  /* ── Layer 3 portable aliases ── */
  --color-bg: var(--bg);
  --color-header-bg: var(--header-bg);
  --color-surface: var(--card-bg);
  --color-surface-container: var(--sheet-bg);
  --color-text: var(--text);
  --color-on-surface: var(--text);
  --color-text-soft: var(--text-soft);
  --color-on-surface-variant: var(--text-soft);
  --color-text-faint: var(--text-faint);
  --color-accent: var(--accent);
  --color-primary: var(--accent);
  --color-accent-deep: var(--accent-deep);
  --color-primary-hover: var(--accent-deep);
  --color-accent-fg: var(--accent-fg);
  --color-primary-foreground: var(--accent-fg);
  --color-danger: var(--danger);
  --color-hairline: var(--hairline);
  --color-border: var(--hairline);
  --color-field-bg: var(--field-bg);
  --color-field-line: var(--field-line);
  --color-card-bg: var(--card-bg);
  --color-card-line: var(--card-line);
  --color-card-shadow: var(--card-shadow);
  --color-sheet-bg: var(--sheet-bg);
  --color-sheet-line: var(--sheet-line);
  --color-sheet-hi: var(--sheet-hi);
  --color-sheet-scrim: var(--sheet-scrim);
  --font-family-base: var(--font-cn);
  --font-family-display: var(--font-en);
  --font-family-script: var(--font-script);
  --type-scale: var(--fs-scale);
  --bubble-radius: clamp(14px, 2vw, 20px);
  --radius-bubble: var(--bubble-radius);
  --shadow-default: var(--shadow);
  --motion-fast: var(--motion-fast);
  --motion-normal: var(--motion-normal);
  --ease-soft: var(--ease-soft);
  --layout-header-h: var(--header-h);
  --layout-side-pad: var(--side-pad);
  --layout-avatar-size: var(--avatar-size);
  --layout-composer-h: var(--composer-h);
}

@media (max-width: 520px) {
  :root {
    --side-pad: 16px;
    --header-h: 68px;
    --avatar-size: 32px;
    --edge-fade-top: 10px;
  }
}

  <style>
    /* Page-scoped critical layout: static, no JS-driven reflow */
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: var(--font-family-base);
      background: var(--bg) url('../assets/beach.jpg') center/cover no-repeat fixed;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: var(--scrim);
      pointer-events: none;
      z-index: 0;
    }
    .settings-root {
      position: relative;
      z-index: 1;
      width: 100%;
      min-height: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .safe-top {
      height: env(safe-area-inset-top);
      min-height: 12px;
      flex-shrink: 0;
    }
    .safe-bottom {
      height: env(safe-area-inset-bottom);
      min-height: 8px;
      flex-shrink: 0;
    }

    /* Sticky glass nav bar */
    .nav-bar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      height: var(--header-h);
      min-height: 56px;
      padding: 0 var(--side-pad);
      background: rgba(5, 13, 20, .65);
      border-bottom: 1px solid var(--hairline);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
    }
    .nav-back {
      position: absolute;
      left: var(--side-pad);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      color: var(--text);
      background: transparent;
      border: none;
      cursor: pointer;
      transition: background var(--motion-fast), transform var(--motion-fast);
      -webkit-tap-highlight-color: transparent;
    }
    .nav-back:hover { background: var(--row-press); }
    .nav-back:active { background: var(--row-press); transform: scale(0.95); }
    .nav-back svg { width: 24px; height: 24px; stroke-width: 1.8; }
    .nav-title {
      font-size: 17px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: 0.02em;
    }

    /* Scrollable content area */
    .settings-scroll {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: var(--space-4) var(--side-pad) var(--space-6);
    }
    .settings-content {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: var(--space-5);
    }

    /* iOS-style grouped card */
    .setting-group {
      background: var(--color-card-bg);
      border: 1px solid var(--color-card-line);
      border-radius: var(--radius-lg);
      box-shadow: var(--color-card-shadow);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      overflow: hidden;
    }
    .group-header {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      padding: var(--space-3) var(--space-4) var(--space-2);
      font-size: 13px;
      font-weight: 500;
      color: var(--text-soft);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .group-header svg { width: 14px; height: 14px; stroke-width: 2; }
    .setting-pad { padding: var(--space-4); }

    /* Current preview card */
    .preview-card {
      position: relative;
      width: 100%;
      aspect-ratio: 2.2 / 1;
      min-height: 180px;
      border-radius: var(--radius-lg);
      background: var(--wall) center/cover no-repeat;
      border: 1px solid var(--color-card-line);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.08), var(--shadow-2);
      overflow: hidden;
    }
    .preview-scrim {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(5,13,20,.35) 0%, transparent 40%, rgba(5,13,20,.55) 100%);
      pointer-events: none;
    }
    .preview-label {
      position: absolute;
      left: var(--space-4);
      bottom: var(--space-4);
      font-size: 22px;
      font-weight: 600;
      color: var(--text);
      text-shadow: 0 2px 8px rgba(0,0,0,.35);
    }
    .preview-badge {
      position: absolute;
      right: var(--space-4);
      top: var(--space-4);
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      color: var(--accent-fg);
      background: var(--color-accent);
      box-shadow: 0 2px 8px rgba(0,0,0,.25);
    }
    .preview-badge svg { width: 12px; height: 12px; stroke-width: 2.2; }

    /* Wallpaper thumbnails */
    .wallpaper-row {
      display: flex;
      gap: var(--space-3);
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      padding: 2px;
    }
    .wall-thumb {
      flex: 0 0 auto;
      width: 88px;
      height: 112px;
      border-radius: var(--radius-md);
      border: 2px solid transparent;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: transform var(--motion-fast), border-color var(--motion-fast), box-shadow var(--motion-fast);
      -webkit-tap-highlight-color: transparent;
      box-shadow: 0 4px 12px rgba(0,0,0,.20);
    }
    .wall-thumb:hover { transform: translateY(-2px); }
    .wall-thumb:active { transform: scale(0.96); }
    .wall-thumb.selected {
      border-color: var(--color-accent);
      box-shadow: 0 0 0 3px rgba(168,204,224,.25), 0 4px 12px rgba(0,0,0,.20);
    }
    .wall-thumb::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.12);
      pointer-events: none;
    }
    .wall-beach { background: var(--wall) center/cover no-repeat; }
    .wall-gradient-1 { background: linear-gradient(135deg, #1a2a3a 0%, #2d4a5e 50%, #0f1c26 100%); }
    .wall-gradient-2 { background: linear-gradient(135deg, #0f1c1a 0%, #1f3d36 50%, #0a1512 100%); }
    .wall-gradient-3 { background: linear-gradient(135deg, #1f1826 0%, #3a2d46 50%, #15101c 100%); }

    /* Color swatches */
    .color-row {
      display: flex;
      gap: var(--space-4);
      align-items: center;
      padding: 2px;
    }
    .color-swatch {
      flex: 0 0 auto;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid transparent;
      transition: transform var(--motion-fast), border-color var(--motion-fast), box-shadow var(--motion-fast);
      -webkit-tap-highlight-color: transparent;
      box-shadow: 0 4px 10px rgba(0,0,0,.20);
    }
    .color-swatch:hover { transform: scale(1.08); }
    .color-swatch:active { transform: scale(0.94); }
    .color-swatch.selected {
      border-color: var(--text);
      box-shadow: 0 0 0 3px var(--color-accent), 0 4px 10px rgba(0,0,0,.20);
    }
    .color-coastal { background: #A8CCE0; }
    .color-rose { background: #E08A96; }
    .color-mint { background: #A8D8C0; }
    .color-sand { background: #E6C9A8; }
    .color-lavender { background: #B8A8E0; }

    /* Segmented control */
    .segmented {
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 3px;
      border-radius: var(--radius-md);
      background: var(--seg-track);
      border: 1px solid var(--hairline);
    }
    .segmented-option {
      flex: 1 1 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 36px;
      border-radius: calc(var(--radius-md) - 2px);
      font-size: 14px;
      font-weight: 500;
      color: var(--text-soft);
      background: transparent;
      border: none;
      cursor: pointer;
      transition: color var(--motion-fast), background var(--motion-fast), box-shadow var(--motion-fast);
      -webkit-tap-highlight-color: transparent;
    }
    .segmented-option:hover { color: var(--text); }
    .segmented-option:active { transform: scale(0.98); }
    .segmented-option.selected {
      color: var(--text);
      background: var(--seg-thumb);
      box-shadow: var(--seg-thumb-shadow);
    }
    .segmented-option svg { width: 15px; height: 15px; stroke-width: 2; }

    /* Slider row */
    .slider-row {
      display: flex;
      align-items: center;
      gap: var(--space-3);
    }
    .slider-row svg { width: 18px; height: 18px; stroke-width: 2; color: var(--text-soft); flex-shrink: 0; }
    .slider-label {
      flex-shrink: 0;
      font-size: 14px;
      color: var(--text);
      min-width: 64px;
    }
    .slider-input {
      flex: 1 1 auto;
      appearance: none;
      -webkit-appearance: none;
      width: 100%;
      height: 6px;
      border-radius: 999px;
      background: var(--slider-track);
      outline: none;
      cursor: pointer;
    }
    .slider-input::-webkit-slider-thumb {
      appearance: none;
      -webkit-appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--slider-thumb);
      box-shadow: 0 2px 8px rgba(0,0,0,.30);
      transition: transform var(--motion-fast), box-shadow var(--motion-fast);
    }
    .slider-input::-webkit-slider-thumb:hover { transform: scale(1.1); }
    .slider-input::-moz-range-thumb {
      width: 22px;
      height: 22px;
      border: none;
      border-radius: 50%;
      background: var(--slider-thumb);
      box-shadow: 0 2px 8px rgba(0,0,0,.30);
    }
    .slider-value {
      flex-shrink: 0;
      min-width: 34px;
      text-align: right;
      font-size: 14px;
      font-weight: 600;
      color: var(--color-accent);
    }

    /* Custom CSS textarea */
    .css-textarea {
      width: 100%;
      min-height: 120px;
      padding: var(--space-3) var(--space-4);
      border-radius: var(--radius-md);
      border: 1px solid var(--hairline);
      background: rgba(0, 0, 0, .22);
      color: var(--text);
      font-family: "SF Mono", "Fira Code", "JetBrains Mono", ui-monospace, monospace;
      font-size: 13px;
      line-height: 1.55;
      resize: vertical;
      outline: none;
      transition: border-color var(--motion-fast), box-shadow var(--motion-fast);
    }
    .css-textarea::placeholder { color: var(--text-faint); }
    .css-textarea:focus {
      border-color: var(--color-accent);
      box-shadow: 0 0 0 3px var(--info-ring);
    }
    .css-hint {
      margin-top: var(--space-2);
      font-size: 12px;
      color: var(--text-faint);
      line-height: 1.4;
    }

    .group-spacer { height: var(--space-1); }
  </style>

  <div class="settings-root">
    <div class="safe-top"></div>

    <header class="nav-bar">
      <a href="settings.html" class="nav-back" data-dom-id="appearance-back" aria-label="返回设置">
        <i data-lucide="chevron-left"></i>
      </a>
      <h1 class="nav-title">外观</h1>
    </header>

    <main class="settings-scroll no-scrollbar">
      <div class="settings-content">

        <!-- 当前预览 -->
        <section class="setting-group" aria-label="当前预览">
          <div class="group-header">
            <i data-lucide="image"></i>
            <span>当前预览</span>
          </div>
          <div class="setting-pad">
            <div class="preview-card" data-dom-id="appearance-preview" role="img" aria-label="当前壁纸预览：海滩">
              <div class="preview-scrim"></div>
              <span class="preview-label">海滩</span>
              <span class="preview-badge">
                <i data-lucide="droplets"></i>
                使用中
              </span>
            </div>
          </div>
        </section>

        <!-- 壁纸选择 -->
        <section class="setting-group" aria-label="壁纸选择">
          <div class="group-header">
            <i data-lucide="image"></i>
            <span>壁纸选择</span>
          </div>
          <div class="setting-pad">
            <div class="wallpaper-row no-scrollbar">
              <button type="button" class="wall-thumb wall-beach selected" data-dom-id="appearance-wallpaper-beach" aria-label="海滩" aria-pressed="true"></button>
              <button type="button" class="wall-thumb wall-gradient-1" aria-label="港湾夜色" aria-pressed="false"></button>
              <button type="button" class="wall-thumb wall-gradient-2" aria-label="薄荷海岸" aria-pressed="false"></button>
              <button type="button" class="wall-thumb wall-gradient-3" aria-label="暮光沙滩" aria-pressed="false"></button>
            </div>
          </div>
        </section>

        <!-- 主题配色 -->
        <section class="setting-group" aria-label="主题配色">
          <div class="group-header">
            <i data-lucide="palette"></i>
            <span>主题配色</span>
          </div>
          <div class="setting-pad">
            <div class="color-row" role="radiogroup" aria-label="选择强调色">
              <button type="button" class="color-swatch color-coastal selected" data-dom-id="appearance-color-coastal" role="radio" aria-label="海岸蓝" aria-checked="true"></button>
              <button type="button" class="color-swatch color-rose" role="radio" aria-label="玫瑰粉" aria-checked="false"></button>
              <button type="button" class="color-swatch color-mint" role="radio" aria-label="薄荷绿" aria-checked="false"></button>
              <button type="button" class="color-swatch color-sand" role="radio" aria-label="沙滩金" aria-checked="false"></button>
              <button type="button" class="color-swatch color-lavender" role="radio" aria-label="薰衣草紫" aria-checked="false"></button>
            </div>
          </div>
        </section>

        <!-- 界面风格 -->
        <section class="setting-group" aria-label="界面风格">
          <div class="group-header">
            <i data-lucide="sun"></i>
            <span>界面风格</span>
          </div>
          <div class="setting-pad">
            <div class="segmented" role="tablist" aria-label="界面风格">
              <button type="button" class="segmented-option selected" data-dom-id="appearance-mode-dark" role="tab" aria-selected="true">
                <i data-lucide="moon"></i>
                深色
              </button>
              <button type="button" class="segmented-option" role="tab" aria-selected="false">
                <i data-lucide="sun"></i>
                浅色
              </button>
              <button type="button" class="segmented-option" role="tab" aria-selected="false">
                <i data-lucide="smartphone"></i>
                自动
              </button>
            </div>
          </div>
        </section>

        <!-- 透明度 -->
        <section class="setting-group" aria-label="玻璃强度">
          <div class="group-header">
            <i data-lucide="droplets"></i>
            <span>透明度</span>
          </div>
          <div class="setting-pad">
            <div class="slider-row">
              <i data-lucide="droplets"></i>
              <span class="slider-label">玻璃强度</span>
              <input type="range" class="slider-input" data-dom-id="appearance-opacity-slider" min="0" max="100" value="65" aria-label="玻璃强度">
              <span class="slider-value">65%</span>
            </div>
          </div>
        </section>

        <!-- 自定义 CSS -->
        <section class="setting-group" aria-label="自定义 CSS">
          <div class="group-header">
            <i data-lucide="code"></i>
            <span>自定义 CSS</span>
          </div>
          <div class="setting-pad">
            <textarea class="css-textarea" data-dom-id="appearance-custom-css" placeholder="粘贴自定义 CSS..." spellcheck="false"></textarea>
            <div class="css-hint">直接覆盖当前主题变量，保存后立即生效。</div>
          </div>
        </section>

        <div class="group-spacer"></div>
      </div>
    </main>

    <div class="safe-bottom"></div>
  </div>

  <script>
    lucide.createIcons();

    /* Lightweight interaction feedback: selection states only */
    document.querySelectorAll('.wall-thumb').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.wall-thumb').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
      });
    });

    document.querySelectorAll('.color-swatch').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.color-swatch').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
      });
    });

    document.querySelectorAll('.segmented-option').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.segmented-option').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
      });
    });

    const slider = document.querySelector('.slider-input');
    const sliderValue = document.querySelector('.slider-value');
    slider.addEventListener('input', () => { sliderValue.textContent = slider.value + '%'; });
  </script>
</body>
</html>
