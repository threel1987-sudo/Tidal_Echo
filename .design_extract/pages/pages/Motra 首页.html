  --type-scale: var(--fs-scale);
  --bubble-radius: clamp(14px, 2vw, 20px);

  --shadow-default: var(--shadow);
  --motion-fast: var(--motion-fast);
  --motion-normal: var(--motion-normal);

.hangup:hover { filter: brightness(0.92); }

<body>
  <style>
    /* Page-scoped critical layout: static, no JS-driven reflow */
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: var(--font-family-base);
      background: var(--bg) url('../assets/beach.jpg') center/cover no-repeat;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: var(--scrim);
      pointer-events: none;
      z-index: 0;
    }
    .phone-frame {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .safe-top {
      height: env(safe-area-inset-top);
      min-height: 12px;
      flex-shrink: 0;
    }
    .safe-bottom {
      height: env(safe-area-inset-bottom);
      min-height: 8px;
      flex-shrink: 0;
    }
    .home-screen {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      padding: 28px 24px 10px;
    }

    /* iOS-style 4-column grid: widgets align to icon grid */
    .home-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(5, auto);
      grid-template-areas:
        "photo photo photo photo"
        "anni  anni  app1  app2"
        "anni  anni  app3  app4"
        "app5  app6  board board"
        "app7  app8  board board";
      gap: 32px 18px;
      flex: 1;
      align-content: start;
      width: 100%;
      max-width: 430px;
      margin: 0 auto;
    }
    .home-grid > * { min-width: 0; min-height: 0; }

    /* Widget shared */
    .widget {
      position: relative;
      border-radius: 22px;
      background: var(--color-card-bg);
      border: 1px solid var(--color-card-line);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      box-shadow: var(--color-card-shadow);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Photo widget (full-width top) */
    .widget-photo { grid-area: photo; aspect-ratio: 1.8 / 1; }
    .widget-photo__bg {
      position: absolute;
      inset: 0;
      background: url('../assets/beach.jpg') center/cover no-repeat;
    }
    .widget-photo__scrim {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(5,13,20,0.18) 0%, rgba(5,13,20,0.42) 100%);
    }
    .widget-photo__label {
      position: absolute;
      left: 14px;
      bottom: 12px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      text-shadow: 0 1px 4px rgba(0,0,0,0.35);
    }

    /* Anniversary widget (left 2x2) */
    .widget-anniversary { grid-area: anni; align-items: center; justify-content: center; text-align: center; padding: 12px; aspect-ratio: 1 / 1; }
    .widget-anniversary__label {
      font-size: 11px;
      color: var(--text-soft);
      margin-bottom: var(--space-1);
      letter-spacing: 0.02em;
    }
    .widget-anniversary__num {
      font-size: 46px;
      font-weight: 700;
      line-height: 1;
      color: var(--color-accent);
      font-family: var(--font-family-display);
    }
    .widget-anniversary__unit {
      font-size: 12px;
      color: var(--text-soft);
      margin-top: 2px;
    }
    .widget-anniversary__date {
      font-size: 10px;
      color: var(--text-faint);
      margin-top: var(--space-1);
    }

    /* Writing board widget (right 2x2 bottom) */
    .widget-board { grid-area: board; padding: 14px; aspect-ratio: 1 / 1; background: var(--color-card-bg) repeating-linear-gradient(180deg, transparent 0, transparent 22px, rgba(255,255,255,0.08) 22px, rgba(255,255,255,0.08) 23px); }
    .widget-board__placeholder {
      font-size: 13px;
      line-height: 23px;
      color: var(--text-faint);
      font-style: italic;
    }

    /* App tiles */
    .app-tile {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      align-self: start;
      -webkit-tap-highlight-color: transparent;
      transition: transform var(--motion-fast) var(--ease-soft);
    }
    .app-tile:active { transform: scale(0.93); }
    .app-icon {
      width: 60px;
      height: 60px;
      border-radius: 16px;
      background: var(--color-card-bg);
      border: 1px solid var(--color-card-line);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: var(--color-card-shadow);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--text);
      transition: background var(--motion-fast), transform var(--motion-fast) var(--ease-soft);
    }
    .app-icon:hover { background: rgba(255,255,255,0.20); }
    .app-icon svg {
      width: 26px;
      height: 26px;
      stroke-width: 1.7;
    }
    .app-label {
      font-size: 12px;
      font-weight: 500;
      color: var(--text);
      text-align: center;
      text-shadow: 0 1px 3px rgba(0,0,0,0.35);
    }

    /* Settings sheet preserved */
    .sheet-portal {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: none;
      flex-direction: column;
    }
    .sheet-portal.open { display: flex; }
  </style>

  <div class="phone-frame" data-viewport-mode="document-scroll">
    <div class="safe-top"></div>

    <div class="home-screen">
      <div class="home-grid">
        <div class="widget widget-photo" data-dom-id="widget-photo" aria-label="照片">
          <div class="widget-photo__bg"></div>

        <div class="widget widget-anniversary" data-dom-id="widget-anniversary" aria-label="纪念日">

          <div class="widget-anniversary__unit">天</div>
          <div class="widget-anniversary__date">2026/05/07</div>
        </div>

        <a class="app-tile" data-dom-id="app-chat" role="button" aria-label="聊天" style="grid-area: app1; text-decoration: none;" href="chat.html">
          <div class="app-icon"><i data-lucide="message-circle"></i></div>
          <span class="app-label">聊天</span>
        </a>
        <div class="app-tile" data-dom-id="app-room" role="button" aria-label="房间" style="grid-area: app2;">
          <div class="app-icon"><i data-lucide="home"></i></div>
          <span class="app-label">房间</span>
        </div>
        <div class="app-tile" data-dom-id="app-period" role="button" aria-label="经期" style="grid-area: app3;">
          <div class="app-icon"><i data-lucide="heart"></i></div>
          <span class="app-label">经期</span>
        </div>
        <div class="app-tile" data-dom-id="app-cat" role="button" aria-label="猫咪" style="grid-area: app4;">
          <div class="app-icon"><i data-lucide="cat"></i></div>
          <span class="app-label">猫咪</span>
        </div>

        <div class="app-tile" data-dom-id="app-fridge" role="button" aria-label="冰箱" style="grid-area: app5;">
          <div class="app-icon"><i data-lucide="archive"></i></div>
          <span class="app-label">冰箱</span>
        </div>
        <div class="app-tile" data-dom-id="app-memory" role="button" aria-label="记忆" style="grid-area: app6;">
          <div class="app-icon"><i data-lucide="image"></i></div>
          <span class="app-label">记忆</span>
        </div>
        <div class="app-tile" data-dom-id="app-tide" role="button" aria-label="潮汐" style="grid-area: app7;">
          <div class="app-icon"><i data-lucide="waves"></i></div>
          <span class="app-label">潮汐</span>
        </div>
        <a class="app-tile" data-dom-id="app-settings" role="button" aria-label="设置" style="grid-area: app8; text-decoration: none;" href="settings.html">
          <div class="app-icon"><i data-lucide="settings"></i></div>
          <span class="app-label">设置</span>
        </a>

        <div class="widget widget-board" data-dom-id="widget-board" aria-label="写字板">
          <div class="widget-board__placeholder">写点什么…</div>
        </div>
      </div>
    </div>

    <div class="safe-bottom"></div>
  </div>

  <script>lucide.createIcons();</script>
</body>
</html>
