/* ===== Tidal Echo — Soft Glassmorphism Design Tokens ===== */
/* Pastel Glass theme — milky glass, soft pastel accents, dark beach base */

:root {
  /* --- Brand Primary (soft glass blue) --- */
  --tide-primary:            #A8CCE0;
  --tide-primary-hover:      #BBD8E8;
  --tide-primary-active:     #8EB8D0;
  --tide-primary-glow:       rgba(168, 204, 224, 0.18);
  --tide-primary-foreground: #0A1620;

  /* --- Accent Pastels --- */
  --tide-accent-mint:        #A8D8C8;
  --tide-accent-pink:        #E0B8C8;
  --tide-accent-yellow:      #E8D8A8;
  --tide-accent-lavender:    #C8C8E0;
  --tide-accent-coral:       #E0C0B0;

  /* --- Glass Surfaces (milky) --- */
  --tide-glass-bg:           rgba(255, 255, 255, 0.16);
  --tide-glass-bg-strong:    rgba(255, 255, 255, 0.22);
  --tide-glass-bg-light:     rgba(255, 255, 255, 0.10);
  --tide-glass-border:       rgba(255, 255, 255, 0.12);
  --tide-glass-border-strong: rgba(255, 255, 255, 0.20);
  --tide-glass-blur:         14px;
  --tide-glass-blur-light:   10px;
  --tide-glass-blur-strong:  22px;

  /* --- Neutral / Surface --- */
  --tide-background:         #050D14;
  --tide-foreground:         #F2F0EE;
  --tide-foreground-muted:   #B8B8C0;
  --tide-foreground-dim:     #808088;
  --tide-card:               rgba(255, 255, 255, 0.14);
  --tide-card-foreground:    #F2F0EE;
  --tide-popover:            rgba(18, 22, 30, 0.94);
  --tide-popover-foreground: #F2F0EE;
  --tide-muted:              rgba(255, 255, 255, 0.07);
  --tide-muted-foreground:   #949290;
  --tide-border:             rgba(255, 255, 255, 0.08);
  --tide-input:              rgba(255, 255, 255, 0.12);
  --tide-input-focus:        rgba(255, 255, 255, 0.20);
  --tide-ring:               rgba(168, 204, 224, 0.35);

  /* --- State Colors --- */
  --tide-state-success:      #A8D8C0;
  --tide-state-warning:      #E0D0A8;
  --tide-state-error:        #E0A8A8;
  --tide-state-info:         #A8C0D8;

  /* --- Typography --- */
  --tide-font-sans:          "Inter", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --tide-font-mono:          "JetBrains Mono", "SF Mono", "Cascadia Code", monospace;

  /* --- Radius --- */
  --tide-radius-sm:          4px;
  --tide-radius-md:          8px;
  --tide-radius-lg:          16px;
  --tide-radius-xl:          20px;
  --tide-radius-full:        9999px;
  --tide-radius-bubble-ai:   5px 20px 20px 20px;
  --tide-radius-bubble-me:   20px 5px 20px 20px;

  /* --- Shadows (softer) --- */
  --tide-shadow-1:           0 2px 12px rgba(0, 0, 0, 0.12);
  --tide-shadow-2:           0 8px 32px rgba(0, 0, 0, 0.20);
  --tide-shadow-3:           0 16px 48px rgba(0, 0, 0, 0.28);
  --tide-shadow-glow:        0 0 24px rgba(168, 204, 224, 0.12);
  --tide-shadow-icon:        0 6px 20px rgba(0, 0, 0, 0.15);

  /* --- Spacing --- */
  --tide-s-1: 4px;
  --tide-s-2: 8px;
  --tide-s-3: 12px;
  --tide-s-4: 16px;
  --tide-s-5: 24px;
  --tide-s-6: 32px;
  --tide-s-7: 48px;
  --tide-s-8: 80px;

  /* --- Sizing --- */
  --tide-bar-top: 60px;
  --tide-bar-bottom: 72px;
  --tide-side-padding: 16px;
}

/* ===== Glassmorphism Utility Classes ===== */
.glass-card {
  background: var(--tide-glass-bg);
  backdrop-filter: blur(var(--tide-glass-blur));
  -webkit-backdrop-filter: blur(var(--tide-glass-blur));
  border: 1px solid var(--tide-glass-border);
  border-radius: var(--tide-radius-lg);
  box-shadow: var(--tide-shadow-2);
}

.glass-card-strong {
  background: var(--tide-glass-bg-strong);
  backdrop-filter: blur(var(--tide-glass-blur));
  -webkit-backdrop-filter: blur(var(--tide-glass-blur));
  border: 1px solid var(--tide-glass-border-strong);
  border-radius: var(--tide-radius-lg);
  box-shadow: var(--tide-shadow-2);
}

.glass-panel {
  background: var(--tide-glass-bg-light);
  backdrop-filter: blur(var(--tide-glass-blur-light));
  -webkit-backdrop-filter: blur(var(--tide-glass-blur-light));
  border-bottom: 1px solid var(--tide-glass-border);
}

.glass-input {
  background: var(--tide-input);
  backdrop-filter: blur(var(--tide-glass-blur));
  -webkit-backdrop-filter: blur(var(--tide-glass-blur));
  border: 1px solid var(--tide-glass-border);
  border-radius: var(--tide-radius-md);
  color: var(--tide-foreground);
  font-family: var(--tide-font-sans);
  font-size: 15px;
  padding: 12px 16px;
  outline: none;
  transition: all 0.2s ease;
}

.glass-input:focus {
  background: var(--tide-input-focus);
  border-color: var(--tide-glass-border-strong);
  box-shadow: 0 0 0 3px var(--tide-ring);
}

.glass-input::placeholder {
  color: var(--tide-foreground-dim);
}

.glass-btn {
  background: var(--tide-glass-bg);
  backdrop-filter: blur(var(--tide-glass-blur-light));
  -webkit-backdrop-filter: blur(var(--tide-glass-blur-light));
  border: 1px solid var(--tide-glass-border);
  border-radius: var(--tide-radius-md);
  color: var(--tide-foreground);
  font-family: var(--tide-font-sans);
  font-size: 14px;
  font-weight: 500;
  padding: 10px 20px;
  cursor: pointer;
  transition: all 0.2s ease;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

.glass-btn:hover {
  background: var(--tide-glass-bg-strong);
  border-color: var(--tide-glass-border-strong);
}

.glass-btn-primary {
  background: var(--tide-primary);
  border-color: transparent;
  color: var(--tide-primary-foreground);
  font-weight: 600;
  box-shadow: var(--tide-shadow-glow);
}

.glass-btn-primary:hover {
  background: var(--tide-primary-hover);
  box-shadow: 0 0 28px rgba(168, 204, 224, 0.25);
}

.glass-btn-icon {
  width: 40px;
  height: 40px;
  padding: 0;
  border-radius: var(--tide-radius-full);
  background: var(--tide-glass-bg);
  border: 1px solid var(--tide-glass-border);
  backdrop-filter: blur(var(--tide-glass-blur-light));
  -webkit-backdrop-filter: blur(var(--tide-glass-blur-light));
  color: var(--tide-foreground);
  font-size: 18px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s ease;
}

.glass-btn-icon:hover {
  background: var(--tide-glass-bg-strong);
  border-color: var(--tide-glass-border-strong);
}

/* ===== Typography Scale ===== */
.tide-display {
  font-family: var(--tide-font-sans);
  font-size: clamp(32px, 5vw, 48px);
  font-weight: 600;
  line-height: 1.1;
  letter-spacing: -0.02em;
  text-wrap: balance;
}

.tide-h1 {
  font-family: var(--tide-font-sans);
  font-size: clamp(26px, 3.5vw, 36px);
  font-weight: 600;
  line-height: 1.2;
  letter-spacing: -0.015em;
  text-wrap: balance;
}

.tide-h2 {
  font-family: var(--tide-font-sans);
  font-size: 20px;
  font-weight: 600;
  line-height: 1.25;
  letter-spacing: -0.01em;
}

.tide-h3 {
  font-family: var(--tide-font-sans);
  font-size: 17px;
  font-weight: 600;
  line-height: 1.3;
}

.tide-body {
  font-family: var(--tide-font-sans);
  font-size: 15px;
  font-weight: 400;
  line-height: 1.6;
}

.tide-body-lg {
  font-family: var(--tide-font-sans);
  font-size: 17px;
  font-weight: 400;
  line-height: 1.55;
}

.tide-caption {
  font-family: var(--tide-font-sans);
  font-size: 13px;
  font-weight: 400;
  line-height: 1.5;
  letter-spacing: 0.005em;
  color: var(--tide-foreground-muted);
}

.tide-mono {
  font-family: var(--tide-font-mono);
  font-size: 13px;
  font-weight: 500;
  line-height: 1.5;
}

/* ===== Base Reset ===== */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  font-family: var(--tide-font-sans);
  color: var(--tide-foreground);
  background: var(--tide-background);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow-x: hidden;
}

/* ===== Page Shell ===== */
.page-shell {
  position: relative;
  width: 100%;
  max-width: 430px;
  margin: 0 auto;
  min-height: 100dvh;
  overflow-y: auto;
  overflow-x: hidden;
  background-color: var(--tide-background);
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  background-attachment: fixed;
}

.page-bg-beach {
  background-image: url('../assets/bg-beach.jpg');
}

.page-bg-overlay {
  position: fixed;
  inset: 0;
  background: linear-gradient(
    180deg,
    rgba(5, 13, 20, 0.40) 0%,
    rgba(5, 13, 20, 0.25) 40%,
    rgba(5, 13, 20, 0.50) 100%
  );
  pointer-events: none;
  z-index: 0;
}

.page-content {
  position: relative;
  z-index: 1;
  padding: 0 var(--tide-side-padding);
  min-height: 100dvh;
}

/* ===== Top Bar ===== */
.top-bar {
  position: sticky;
  top: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: var(--tide-bar-top);
  padding: 0 var(--tide-side-padding);
  background: rgba(255, 255, 255, 0.08);
  backdrop-filter: blur(var(--tide-glass-blur-strong));
  -webkit-backdrop-filter: blur(var(--tide-glass-blur-strong));
  border-bottom: 1px solid rgba(255, 255, 255, 0.06);
}

.top-bar-title {
  font-size: 17px;
  font-weight: 600;
  color: var(--tide-foreground);
  letter-spacing: -0.01em;
}

/* ===== Bottom Bar ===== */
.bottom-bar {
  position: sticky;
  bottom: 0;
  z-index: 100;
  padding: 12px var(--tide-side-padding);
  padding-bottom: max(12px, env(safe-area-inset-bottom));
  background: rgba(255, 255, 255, 0.08);
  backdrop-filter: blur(var(--tide-glass-blur-strong));
  -webkit-backdrop-filter: blur(var(--tide-glass-blur-strong));
  border-top: 1px solid rgba(255, 255, 255, 0.06);
}

/* ===== Icon Card (home nav) ===== */
.glass-icon-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 18px 12px 14px;
  border-radius: var(--tide-radius-xl);
  background: var(--tide-glass-bg);
  backdrop-filter: blur(var(--tide-glass-blur));
  -webkit-backdrop-filter: blur(var(--tide-glass-blur));
  border: 1px solid var(--tide-glass-border);
  box-shadow: var(--tide-shadow-2);
  transition: all 0.25s ease;
  cursor: pointer;
  text-decoration: none;
  color: var(--tide-foreground);
}

.glass-icon-card:hover {
  background: var(--tide-glass-bg-strong);
  border-color: var(--tide-glass-border-strong);
  transform: translateY(-2px);
  box-shadow: var(--tide-shadow-3);
}

.glass-icon-card:active {
  transform: translateY(0);
  box-shadow: var(--tide-shadow-1);
}

.glass-icon-img {
  width: 52px;
  height: 52px;
  border-radius: 14px;
  object-fit: cover;
  box-shadow: var(--tide-shadow-icon);
}

.glass-icon-label {
  font-size: 14px;
  font-weight: 500;
  color: var(--tide-foreground);
  letter-spacing: 0.01em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}

/* ===== Scrollbar ===== */
::-webkit-scrollbar {
  width: 0;
  height: 0;
}

/* ===== Transitions ===== */
.fade-in {
  animation: fadeIn 0.4s ease both;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}

@keyframes glow-pulse {
  0%, 100% { box-shadow: 0 0 20px rgba(168, 204, 224, 0.10); }
  50%      { box-shadow: 0 0 32px rgba(168, 204, 224, 0.22); }
}

.glow-pulse {
  animation: glow-pulse 3s ease-in-out infinite;
}
